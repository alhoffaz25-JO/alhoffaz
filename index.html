<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F7B3E">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script>(function(){function g(){try{return localStorage.getItem('theme')||'auto'}catch(e){return 'auto'}}
function ap(){var t=g(),d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#0A3B22':'#0F7B3E'}
ap();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',ap)}catch(e){}
window.getTheme=g;window.setTheme=function(t){try{localStorage.setItem('theme',t)}catch(e){}ap();document.querySelectorAll('#theme-seg button').forEach(function(b){b.classList.toggle('active',b.dataset.t===t)})}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>شعبة الحفاظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#098046; --green-dark:#06532E; --green-tint:#EBF5F0;
  --gold:#D6A755; --gold-light:#E4C690; --beige:#F3EEE0; --bg:#FFFFFF; --card:#FFFFFF;
  --text:#1C241C; --text-muted:#748078; --border:#DCEAE1; --radius:16px;
  --shadow:0 1px 2px rgba(6,83,46,0.05), 0 10px 26px -10px rgba(6,83,46,0.16);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:80px; min-height:100vh;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
svg{display:block;}
.topbar{background:linear-gradient(155deg,var(--green) 0%,var(--green-dark) 100%); color:#fff; padding:20px 18px 24px; position:sticky; top:0; z-index:25; overflow:hidden; box-shadow:0 8px 22px -8px rgba(6,83,46,0.45), 0 2px 6px -2px rgba(6,83,46,0.25);}
.topbar::before{content:""; position:absolute; inset:0; background-image:radial-gradient(circle at 92% -10%, rgba(228,198,144,0.22) 0, transparent 45%);}
.topbar-row{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
.brand{display:flex; align-items:center; gap:11px;}
.logo-circle{width:42px; height:42px; border-radius:50%; background:var(--gold-light); color:var(--green-dark); display:flex; align-items:center; justify-content:center; border:1.5px solid rgba(255,255,255,0.55); box-shadow:0 2px 8px rgba(0,0,0,0.15); overflow:hidden;}
.logo-circle img{width:100%; height:100%; object-fit:cover;}
.brand-name{font-family:'Amiri',serif; font-weight:700; font-size:19px;}
.brand-sub{font-size:12px; color:rgba(255,255,255,0.68); margin-top:1px;}
.topbar-actions{display:flex; gap:9px; align-items:center;}
.icon-btn{width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,0.1);}
.icon-btn.on{background:var(--gold-light); color:var(--green-dark);}
.greeting{position:relative; z-index:1; margin-top:16px; font-size:13.5px; color:rgba(255,255,255,0.82);}
.greeting b{font-weight:700; color:#fff;}
.greeting-rule{width:30px; height:2px; background:var(--gold-light); border-radius:2px; margin-top:9px; position:relative; z-index:1;}
.edit-banner{background:var(--gold); color:#fff; text-align:center; font-size:12px; font-weight:700; padding:7px;}
.page{padding:18px 16px 24px; max-width:520px; margin:0 auto; animation:fade .2s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
.section-title{font-size:13.5px; font-weight:700; color:var(--text); margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.section-title .bar{width:4px; height:14px; background:linear-gradient(180deg,var(--gold-light),var(--gold)); border-radius:2px;}
.vision-card{background:linear-gradient(160deg,var(--green-dark),var(--green)); color:#fff; border-radius:20px; padding:22px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.vision-title{font-family:'Amiri',serif; font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; position:relative; z-index:1;}
.vision-title .vi{width:28px; height:28px; border-radius:8px; background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; color:var(--gold-light);}
.vision-text{font-size:12.5px; line-height:1.9; color:rgba(255,255,255,0.88); margin-top:8px; position:relative; z-index:1;}
.vision-divider{height:1px; background:rgba(255,255,255,0.15); margin:14px 0;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
.stat-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow);}
.stat-icon{width:32px; height:32px; border-radius:9px; background:var(--green-tint); color:var(--green); display:flex; align-items:center; justify-content:center;}
.stat-num{font-size:22px; font-weight:900; color:var(--green); margin-top:9px;}
.stat-label{font-size:12px; color:var(--text-muted); margin-top:2px;}
.khana-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
.khana{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 12px; text-align:center; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:9px; position:relative;}
.khana:active{transform:scale(.96);}
.khana-icon{width:46px; height:46px; border-radius:13px; background:var(--green-tint); color:var(--green); display:flex; align-items:center; justify-content:center;}
.khana-label{font-size:13.5px; font-weight:700;}
.khana-sub{font-size:12px; color:var(--text-muted);}
.list{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-top:8px;}
.row{display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-bottom:1px solid var(--border); gap:10px;}
.row:last-child{border-bottom:none;}
.row-left{display:flex; align-items:center; gap:11px; min-width:0;}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--green-tint); color:var(--green); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px; flex-shrink:0; overflow:hidden; position:relative;}
.avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
.avatar-edit-badge{position:absolute; bottom:-2px; left:-2px; width:22px; height:22px; border-radius:50%; background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center; border:2px solid var(--card);}
.row-title{font-size:13.5px; font-weight:700;}
.row-sub{font-size:12px; color:var(--text-muted); margin-top:2px;}
.chevron{color:var(--text-muted); display:flex;}
.badge{font-size:12px; padding:4px 10px; border-radius:20px; font-weight:700;}
.badge.green{background:var(--green-tint); color:var(--green);}
.badge.gold{background:#F3EBD6; color:var(--gold);}
.badge.gray{background:#EFEFEF; color:#888;}
.cap-group{border-bottom:1px solid var(--border);}
.cap-group:last-child{border-bottom:none;}
.cap-group summary{list-style:none; display:flex; align-items:center; gap:11px; padding:13px 14px; cursor:pointer;}
.cap-group summary::-webkit-details-marker{display:none;}
.cap-group .cap-chev{transition:transform .2s; flex-shrink:0;}
.cap-group[open] .cap-chev{transform:rotate(-90deg);}
.cap-body{background:#FAFCFB; border-top:1px solid var(--border);}
#present{position:fixed; inset:0; z-index:9999; background:linear-gradient(160deg,var(--green-dark),#06281c); color:#fff; display:flex; flex-direction:column; overflow:hidden}
.pr-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:12px 18px}
.pr-ctrls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.pr-ctrls select,.pr-ctrls button,.pr-nav button{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer}
.pr-ctrls select option{color:#000}
.pr-stage{flex:1; overflow:auto; padding:8px 20px 12px; display:flex; flex-direction:column; justify-content:center; align-items:center}
.pr-slide{width:100%; max-width:980px; animation:prIn .6s ease both}
@keyframes prIn{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
.pr-h{font-size:clamp(22px,4.5vw,44px); font-weight:900; text-align:center}
.pr-sub{text-align:center; opacity:.8; font-size:clamp(12px,2vw,18px); margin:6px 0 22px}
.pr-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}
.pr-card{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:22px 10px; text-align:center}
.pr-num{font-size:clamp(34px,8vw,84px); font-weight:900; color:var(--gold-light); line-height:1.1}
.pr-lbl{font-size:clamp(12px,2vw,20px); opacity:.9; margin-top:6px}
.pr-row{display:flex; align-items:center; gap:12px; margin:10px 0; animation:prIn .6s ease both; animation-delay:calc(var(--i)*.12s)}
.pr-rank{width:34px; height:34px; border-radius:50%; background:var(--gold-light); color:#06281c; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.pr-name{min-width:110px; max-width:220px; font-weight:800; font-size:clamp(14px,2.4vw,24px)}
.pr-track{flex:1; height:16px; background:rgba(255,255,255,.14); border-radius:99px; overflow:hidden}
.pr-bar-fill{height:100%; width:0; border-radius:99px; transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.pr-val{min-width:80px; text-align:left; font-weight:900; color:var(--gold-light); font-size:clamp(14px,2.4vw,24px)}
.pr-nav{display:flex; align-items:center; justify-content:center; gap:10px; padding:12px}
.pr-dot{width:9px; height:9px; border-radius:9px; background:rgba(255,255,255,.3); transition:all .3s}
.pr-dot.on{background:var(--gold-light); width:24px}
@media (prefers-reduced-motion:reduce){.pr-slide,.pr-row{animation:none}.pr-bar-fill{transition:none}}
.pr-pop{display:inline-block; animation:prPop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes prPop{from{transform:scale(.2); opacity:0}to{transform:scale(1); opacity:1}}
.pr-countdown{font-size:clamp(60px,16vw,160px); font-weight:900; color:var(--gold-light); text-align:center; min-height:1.2em; margin-top:10px}
.pr-delta{font-weight:900; margin-top:6px; font-size:clamp(13px,2.2vw,22px)}
.pr-delta.up{color:#5fe0a0} .pr-delta.down{color:#ff8a80}
.pr-arrow{display:inline-block; animation:prBob 1s ease-in-out infinite}
.pr-delta.down .pr-arrow{animation-name:prBobD}
@keyframes prBob{50%{transform:translateY(-4px)}}
@keyframes prBobD{50%{transform:translateY(4px)}}
.pr-race-row{position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:12px; transition:transform .45s ease}
.pr-race-row .pr-bar-fill{transition:none}
.pr-race-row.win .pr-track{box-shadow:0 0 24px var(--gold-light)}
.pr-race-row.win .pr-val,.pr-race-row.win .pr-name{text-shadow:0 0 14px var(--gold-light)}
.pr-vs-row{margin:14px 0; animation:prIn .6s ease both; animation-delay:calc(var(--i)*.25s)}
.pr-vs-l{text-align:center; opacity:.85; font-weight:700; margin-bottom:4px}
.pr-vs-row .pr-val{text-align:center; min-width:90px; transition:transform .3s}
.pr-val.win{color:#fff; text-shadow:0 0 14px var(--gold-light),0 0 28px var(--gold-light); transform:scale(1.15)}
.pr-vs-head{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:clamp(18px,4vw,36px); font-weight:900; margin-bottom:8px}
.pr-vsbadge{background:var(--gold-light); color:#06281c; border-radius:50%; width:56px; height:56px; display:flex; align-items:center; justify-content:center; font-weight:900; flex-shrink:0; animation:prPop .7s both}
.pr-podium{display:flex; align-items:flex-end; gap:12px; height:clamp(240px,46vh,440px)}
.pr-pod{flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; text-align:center}
.pr-pod-top{animation:prIn .6s ease calc(var(--d) + .7s) both; margin-bottom:8px}
.pr-pod-name{font-weight:900; font-size:clamp(14px,2.6vw,26px)}
.pr-pod-pts{color:var(--gold-light); font-weight:900; font-size:clamp(13px,2.2vw,22px)}
.pr-pod-col{width:100%; height:var(--h); border-radius:14px 14px 0 0; background:linear-gradient(180deg,var(--gold-light),#a8842a); display:flex; align-items:flex-start; justify-content:center; padding-top:10px; font-size:clamp(28px,6vw,60px); font-weight:900; color:#06281c; animation:podUp 1s cubic-bezier(.2,.8,.2,1) var(--d) both}
@keyframes podUp{from{height:0}}
.pr-crown{font-size:clamp(28px,6vw,56px); animation:prBob 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pr-pod-col,.pr-pod-top,.pr-vs-row,.pr-vsbadge,.pr-pop,.pr-arrow,.pr-crown{animation:none}}
.pv-hero{position:relative; overflow:hidden; border-radius:22px; padding:26px 16px 20px; text-align:center; color:#fff; background:linear-gradient(150deg,var(--green-dark),var(--green,#0f7a44)); margin-top:12px; box-shadow:0 10px 26px rgba(10,80,50,.22)}
.pv-hero::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.16),transparent 40%),radial-gradient(circle at 85% 80%,rgba(224,184,75,.25),transparent 45%)}
.pv-hero>*{position:relative}
.pv-ava{display:inline-block}
.pv-ava .avatar{border:3px solid var(--gold-light); box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pv-name{font-size:20px; font-weight:900; margin-top:10px}
.pv-role{display:inline-block; margin-top:6px; padding:3px 14px; border-radius:99px; background:rgba(255,255,255,.18); font-size:12px}
.pv-chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px}
.pv-chips span{background:var(--gold-light); color:#06281c; font-weight:800; font-size:12px; padding:4px 12px; border-radius:99px}
.pv-grid{display:grid; gap:10px; margin-top:14px}
.pv-item{display:flex; align-items:center; gap:12px; background:var(--card,#fff); border:1px solid var(--border,#e6ece8); border-radius:16px; padding:12px 14px; box-shadow:0 2px 10px rgba(0,0,0,.04)}
.pv-ic{width:40px; height:40px; border-radius:12px; background:#EAF4EE; color:#0f7a44; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.pv-l{font-size:12px; color:var(--text-muted,#888)}
.pv-v{font-size:14px; font-weight:800; margin-top:2px; word-break:break-word}
.pv-act{font-size:12px; font-weight:800; text-decoration:none; background:#EAF4EE; color:#0f7a44; padding:6px 10px; border-radius:99px}
.att-grid{border-collapse:separate; border-spacing:0; font-size:12px; width:auto; margin:0}
.att-grid th,.att-grid td{padding:8px 6px; text-align:center; white-space:nowrap}
.att-grid thead th{background:var(--green-dark); color:#fff}
.att-grid .ag-name{position:sticky; right:0; z-index:2; background:var(--card,#fff); min-width:104px; text-align:right; font-weight:700; box-shadow:-2px 0 4px rgba(0,0,0,.06)}
.att-grid thead .ag-name{background:var(--green-dark); color:#fff}
.ag-c{min-width:42px; cursor:pointer; border-bottom:1px solid var(--border,#eee); font-weight:900; user-select:none}
.ag-c.p{background:#DDF3E6; color:#13804a} .ag-c.l{background:#FBF0D1; color:#9a7410} .ag-c.a{background:#FADBD8; color:#B23A3A}
.ag-c.lock{background:#F1F1F1; cursor:not-allowed}
.ag-s{font-size:12px; font-weight:700; border-bottom:1px solid var(--border,#eee)}
.ag-all{display:block; margin:4px auto 0; font-size:12px; padding:2px 6px; border-radius:6px; border:none; background:rgba(255,255,255,.25); color:#fff; cursor:pointer; font-family:inherit}
.ag-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold-light); margin-inline-start:3px}
.ag-months{display:flex; gap:8px; overflow-x:auto; padding:4px 0; margin-top:12px}
.ag-mb{flex-shrink:0; padding:8px 14px; border-radius:99px; border:1px solid var(--border,#ddd); background:var(--card,#fff); font:inherit; font-size:12.5px; cursor:pointer}
.ag-mb.on{background:var(--green-dark); color:#fff; border-color:var(--green-dark)}
.pr-champs{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px}
.pr-ch{display:flex; align-items:center; gap:10px; margin:8px 0}
.pr-ch-n{flex:1; font-weight:800; font-size:clamp(14px,2.4vw,22px)}
.pr-ch-v{color:var(--gold-light); font-weight:900; font-size:clamp(14px,2.4vw,22px)}
.pr-tbl{width:100%; border-collapse:separate; border-spacing:0 6px; color:#fff; margin:0}
.pr-tbl th{background:transparent !important; color:var(--gold-light) !important; font-size:clamp(11px,2vw,16px); padding:6px; text-align:center; white-space:nowrap}
.pr-tbl td{background:rgba(255,255,255,.08); padding:8px 6px; text-align:center; min-width:70px}
.pr-tbl td.pr-tn{text-align:right; font-weight:800; font-size:clamp(13px,2.2vw,20px); background:rgba(255,255,255,.12); white-space:nowrap}
.pr-cv{font-weight:900; font-size:clamp(13px,2.2vw,20px)}
.pr-mini{height:6px; background:rgba(255,255,255,.14); border-radius:9px; overflow:hidden; margin-top:5px}
.pr-tbl td.best{background:rgba(224,184,75,.22); box-shadow:0 0 14px rgba(224,184,75,.55) inset}
.pr-tbl td.best .pr-cv{color:var(--gold-light); text-shadow:0 0 10px var(--gold-light)}
.jr{animation:ringIn 1.5s ease both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
@media (prefers-reduced-motion:reduce){.jr{animation:none}}
.pm-btn{border:none; border-radius:8px; padding:5px 11px; font:inherit; font-size:12px; font-weight:800; cursor:pointer}
.wk-ring{width:54px; height:54px; border-radius:50%; background:conic-gradient(var(--c) calc(var(--p)*1%), #EEF0F2 0); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.wk-ring span{width:42px; height:42px; border-radius:50%; background:var(--card,#fff); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:12px}
.wk-bars{display:flex; align-items:flex-end; gap:5px; height:90px; margin-top:12px; direction:rtl}
.wk-bar{flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:3px; font-size:12px; color:var(--text-muted,#888)}
.wk-bar i{display:block; width:100%; border-radius:6px 6px 0 0; background:linear-gradient(180deg,#3FAE6F,#9be0bb); min-height:2px}
.wk-card{background:var(--card,#fff); border:1px solid var(--border,#e6ece8); border-radius:16px; margin-top:10px; overflow:hidden}
.wk-card summary{list-style:none; display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer}
.wk-card summary::-webkit-details-marker{display:none}
.ag-foot td{font-weight:800; background:#F6F8F7; font-size:12px}
.ag-foot .ag-name{background:#F6F8F7}
.ag-add{display:flex; gap:8px; align-items:center; margin-top:10px}
.ag-add input{flex:1}
.ag-add .btn{width:auto; padding:10px 14px; white-space:nowrap}
.dp{display:flex; gap:6px; width:100%}
.dp select{width:auto; min-width:0; padding:11px 6px; border:1px solid var(--border); border-radius:10px; font-family:inherit; font-size:13.5px; background:var(--card); color:var(--text)}
.dp .dp-d{flex:.8} .dp .dp-m{flex:1.5} .dp .dp-y{flex:1.1}
.ag-add .dp{flex:1}
.nav-toast{position:fixed; bottom:84px; left:50%; transform:translateX(-50%); background:rgba(20,20,20,.9); color:#fff; padding:10px 18px; border-radius:99px; font-size:13px; z-index:10000; animation:prIn .3s ease both}
.dc{border-radius:20px; padding:16px 18px; margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:14px; border:1px solid; animation:prIn .5s ease both}
.dc-ic{width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0}

function stuWord(n){ n=Math.abs(Number(n)||0); if(n===0||(n>=3&&n<=10)) return 'طلاب'; if(n===2) return 'طالبان'; if(n>=11&&n<=99) return 'طالباً'; return 'طالب'; }
function stuCnt(n){ n=Number(n)||0; if(n===1) return 'طالب واحد'; if(n===2) return 'طالبان'; return n+' '+stuWord(n); }
function stuReg(n){ n=Number(n)||0; if(n===1) return 'طالب واحد مسجّل'; if(n===2) return 'طالبان مسجّلان'; if(n>=3&&n<=10) return n+' طلاب مسجّلين'; if(n>=11&&n<=99) return n+' طالباً مسجّلاً'; return n+' طالب مسجّل'; }

function gradeToPct(g){ return {'ممتاز':100,'جيد جدًا':85,'جيد':70,'مقبول':55}[g] ?? 70; }
function studentCycle(hifzLog){
  const byDate = {};
  hifzLog.forEach(r=>{ if(r.date) (byDate[r.date] = byDate[r.date]||[]).push(r); });
  const sess = Object.keys(byDate).sort().map(d=>({date:d, pct:Math.round(byDate[d].reduce((a,r)=>a+gradeToPct(r.grade),0)/byDate[d].length)}));
  const evals = [];
  for(let i=0; i+4<=sess.length; i+=4){ const g = sess.slice(i,i+4); evals.push({date:g[3].date, pct:Math.round(g.reduce((a,x)=>a+x.pct,0)/4)}); }
  return { evals, inProgress: sess.length % 4 };
}
function monthlyFromEvals(evals){ const m = todayStr().slice(0,7); const inMonth = evals.filter(e=>e.date.startsWith(m)); if(!inMonth.length) return null; return Math.round(inMonth.reduce((a,e)=>a+e.pct,0)/inMonth.length); }

function ymdLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return ymdLocal(new Date()); }
function weekStartStr(){ const d=new Date(); const day=d.getDay(); const diff=(day-6+7)%7; d.setDate(d.getDate()-diff); return ymdLocal(d); }
const ATT_POINTS = {'حضور':7,'تأخر':3,'غياب':0};
const TYPE_POINTS = { hifz:{0:6,1:4,2:2}, review:{0:3,1:2,2:1}, recitation:{0:5,1:3,2:2} };
function wirdPts(table, errStr, pages){
  const e = parseInt(errStr)||0, n = Math.max(1, pages||1);
  let total = 0;
  for(let i=0;i<n;i++){ const errs = Math.floor(e/n) + (i < e%n ? 1 : 0); total += table[Math.min(errs,2)]||0; }
  return total;
}
function recPts(table, r){ return r.pts!=null ? r.pts : tierPts(table, r.errors); }
function tierPts(table, errStr){ const n=parseInt(errStr); const t = isNaN(n)?2:Math.min(n,2); return table[t]||0; }
function pointsFromRecords(det){
  const ws = weekStartStr(); const ms = todayStr().slice(0,7);
  let weekly=0, monthly=0;
  const items = [
    ...(det.attendance||[]).map(r=>({date:r.date, pts: ATT_POINTS[r.status]||0})),
    ...(det.hifzLog||[]).map(r=>({date:r.date, pts: recPts(TYPE_POINTS.hifz, r)})),
    ...(det.reviewLog||[]).map(r=>({date:r.date, pts: recPts(TYPE_POINTS.review, r)})),
    ...(det.recitationLog||[]).map(r=>({date:r.date, pts: recPts(TYPE_POINTS.recitation, r)})),
  ];
  items.forEach(it=>{ if(it.date>=ws) weekly+=it.pts; if(it.date && it.date.startsWith(ms)) monthly+=it.pts; });
  return {weekly, monthly};
}

let PAGE_TOTAL = null;
function pageTotals(){
  if(PAGE_TOTAL) return PAGE_TOTAL;
  const t = {};
  try{ SURAHS.forEach((sr,i)=>{ for(let a=1;a<=sr.ayat;a++){ const p = findMushafPage(i+1,a); t[p] = (t[p]||0)+1; } }); }catch(e){ PAGE_TOTAL = {}; return PAGE_TOTAL; }
  PAGE_TOTAL = t; return t;
}
function rangeSuggest(surahName, f, t){
  const idx = SURAHS.findIndex(x=>x.name===surahName);
  if(idx<0 || !f || !t || f>t || f<1 || t>SURAHS[idx].ayat) return null;
  const tot = pageTotals(), cnt = {};
  try{ for(let a=f;a<=t;a++){ const p = findMushafPage(idx+1,a); cnt[p] = (cnt[p]||0)+1; } }catch(e){ return null; }
  let sum = 0; for(const p in cnt){ if(tot[p]) sum += Math.min(1, cnt[p]/tot[p]); }
  if(!sum) return null;
  let full = Math.floor(sum+0.0001), r = sum-full; if(r>0.83){ full++; r = 0; }
  const frac = [0,0.33,0.5,0.67].reduce((x,y)=>Math.abs(y-r)<Math.abs(x-r) ? y : x);
  return {sum, full, frac, total: full+frac};
}
function wfAutoPages(suf){
  const sObj = SURAHS.find(x=>x.name===(document.getElementById('wf-surah'+suf+'-input')||{value:''}).value.trim());
  const full = document.getElementById('wf-full'+suf), frac = document.getElementById('wf-frac'+suf), hint = document.getElementById('wf-hint'+suf);
  if(!sObj || !full) return;
  const f = parseInt(normDigits(document.getElementById('wf-from'+suf).value),10), t = parseInt(normDigits(document.getElementById('wf-to'+suf).value),10);
  const sg = rangeSuggest(sObj.name, f, t);
  if(!sg){ if(hint) hint.textContent = ''; return; }
  if(hint) hint.textContent = 'مقترح تلقائيًا حسب عدد الآيات (تقريبي): '+pgTxt(sg.total)+' صفحة';
  if(!full.dataset.edited) full.value = sg.full;
  if(frac && !frac.dataset.edited) frac.value = String(sg.frac);
}
function pgTxt(x){
  x = Number(x)||0; const w = Math.floor(x+0.001), f = x-w;
  if(f>0.9) return String(w+1);
  const sym = f>0.6 ? '⅔' : f>0.4 ? '½' : f>0.2 ? '⅓' : '';
  return (w ? String(w) : '') + (w && sym ? ' ' : '') + sym || '0';
}

function computeExactPages(surahName, fromN, toN){
  const idx = SURAHS.findIndex(s=>s.name===surahName);
  if(idx<0) return null;
  const surahNum = idx+1;
  try{
    const p1 = findMushafPage(surahNum, Math.min(fromN,toN));
    const p2 = findMushafPage(surahNum, Math.max(fromN,toN));

}

function resizeImageToDataURL(file, maxSize){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev => { img.src = ev.target.result; };
    img.onload = () => {
      let w=img.width, h=img.height;
      if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } } else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.85));
    };
    img.onerror = reject; reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dateField(id, value, kind){
  const m = String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/), Y = new Date().getFullYear();
  const dv = m ? +m[3] : 0, mv = m ? +m[2] : 0, yv = m ? +m[1] : 0;
  let ys = [];
  if(kind==='birth'){ for(let y=Y-5; y>=Y-80; y--) ys.push(y); } else { for(let y=2024; y<=Y+3; y++) ys.push(y); }
  if(yv && !ys.includes(yv)){ ys.push(yv); ys.sort((a,b)=> kind==='birth' ? b-a : a-b); }
  const opt = (v,t,sel) => `<option value="${v}" ${sel?'selected':''}>${t}</option>`;
  const days = Array.from({length:31},(_,i)=>opt(i+1,i+1,dv===i+1)).join('');
  const mons = Array.from({length:12},(_,i)=>opt(i+1,AR_MONTHS[i],mv===i+1)).join('');
  const on = `onchange="window.dpChange('${id}')"`;
  return `<div class="dp" data-for="${id}"><select class="dp-d" ${on}>${opt('','يوم',!dv)}${days}</select><select class="dp-m" ${on}>${opt('','شهر',!mv)}${mons}</select><select class="dp-y" ${on}>${opt('','سنة',!yv)}${ys.map(y=>opt(y,y,y===yv)).join('')}</select><input type="hidden" id="${id}" class="dp-val" value="${m ? value : ''}"></div>`;
}
function dpSync(inp){
  const box = inp.closest ? inp.closest('.dp') : null; if(!box) return;
  const v = String(inp.value||''), m = v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const sd = box.querySelector('.dp-d'), sm = box.querySelector('.dp-m'), sy = box.querySelector('.dp-y');
  if(!m){ sd.value = ''; sm.value = ''; sy.value = ''; return; }
  if(![...sy.options].some(o=>o.value===m[1])){ const o = document.createElement('option'); o.value = m[1]; o.textContent = m[1]; sy.appendChild(o); }
  sd.value = String(+m[3]); sm.value = String(+m[2]); sy.value = m[1];
}
function dpChange(id){
  const inp = document.getElementById(id); if(!inp) return;
  const box = inp.closest('.dp');
  const d = +box.querySelector('.dp-d').value, mo = +box.querySelector('.dp-m').value, y = +box.querySelector('.dp-y').value;
  if(!(d && mo && y)){ dpDesc.set.call(inp, ''); return; }
  const dd = Math.min(d, new Date(y, mo, 0).getDate());
  dpDesc.set.call(inp, y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0'));
  dpSync(inp);
  inp.dispatchEvent(new Event('change', {bubbles:true}));
}
const dpDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
Object.defineProperty(HTMLInputElement.prototype, 'value', {
  get(){ return dpDesc.get.call(this); },
  set(v){ dpDesc.set.call(this, v); if(this.classList && this.classList.contains('dp-val')) dpSync(this); },
  configurable: true
});

function defaultPayMonths(){ const cur = todayStr().slice(0,7), start = ['2026-10', ymShift(cur,-6)].sort().pop(), end = [ymShift(start,7), ymShift(cur,1)].sort().pop(); const out = []; let ym = start; while(ym<=end){ out.push(ym); ym = ymNext(ym); } return out; }

function payDirty(){
  let n = 0; const keys = new Set([...Object.keys(pay.sel), ...Object.keys(pay.prev)]);
  keys.forEach(k=>{ if(pay.sel[k]!==pay.prev[k]) n++; });
  return n;
}
function payClass(v){ return v===undefined ? '' : v>=PAY_PRICE ? 'p' : v>0 ? 'l' : 'a'; }
function payText(v){ return v===undefined ? '' : v>=PAY_PRICE ? '✓' : v>0 ? payFmt(v)+'/'+PAY_PRICE : '✗'; }
function paySummary(sid){
  let full = 0, owed = 0;
  pay.months.forEach(m=>{ const v = pay.sel[sid+'|'+m]; if(v!==undefined){ if(v>=PAY_PRICE) full++; else owed += PAY_PRICE-v; } });
  return 'دفع '+full+' من '+pay.months.length+(owed>0 ? ' · عليه '+payFmt(owed)+' د' : '');
}
function payMonthSum(ym){ let t = 0; cache.students.filter(x=>x.branchId===pay.bid).forEach(x=>{ const v = pay.sel[x.id+'|'+ym]; if(v) t += v; }); return t; }
function payRefresh(sid, ym){
  const c = document.getElementById(`pc-${sid}-${ym}`), v = pay.sel[sid+'|'+ym];
  if(c){ c.className = 'ag-c '+payClass(v); c.textContent = payText(v); }
  const r = document.getElementById('ps-'+sid); if(r) r.textContent = paySummary(sid);
  const f = document.getElementById('pt-'+ym); if(f) f.textContent = payFmt(payMonthSum(ym));
  const info = document.getElementById('p-info'); if(info){ const n = payDirty(); info.textContent = n ? 'تغييرات غير محفوظة: '+n : ''; }
}
function payOldOk(ym, sid){
  if(ym>=todayStr().slice(0,7) || pay.confirmed.has(ym)) return true;
  const filled = sid ? pay.prev[sid+'|'+ym]!==undefined : cache.students.some(x=>x.branchId===pay.bid && pay.prev[x.id+'|'+ym]!==undefined);
  if(!filled) return true;
  if(!confirm('هذا شهر قديم ('+monthLabel(ym,true)+') وفيه دفعات مسجّلة. هل تريد تعديله؟')) return false;
  pay.confirmed.add(ym); return true;
}
let payTimer = null, payLong = false;
function payDown(sid, ym){ payLong = false; clearTimeout(payTimer); payTimer = setTimeout(()=>{ payLong = true; payPrompt(sid, ym); }, 550); }
function payUp(sid, ym){ clearTimeout(payTimer); if(!payLong) payTap(sid, ym); }
function payCancel(){ clearTimeout(payTimer); }
function payTap(sid, ym){
  if(!payOldOk(ym, sid)) return;
  const k = sid+'|'+ym, v = pay.sel[k];
  if(v===undefined) pay.sel[k] = PAY_PRICE;
  else if(v>0 && v<PAY_PRICE) pay.sel[k] = PAY_PRICE;
  else if(v>=PAY_PRICE) pay.sel[k] = 0;
  else delete pay.sel[k];
  payRefresh(sid, ym);
}
function payPrompt(sid, ym){
  if(!payOldOk(ym, sid)) return;
  const k = sid+'|'+ym, cur = pay.sel[k];
  const inp = prompt('المبلغ المدفوع (من '+PAY_PRICE+' دنانير). اتركه فارغًا لمسح الخانة:', cur!==undefined ? cur : '');
  if(inp===null) return;
  if(inp.trim()===''){ delete pay.sel[k]; }
  else { const n = Number(inp); if(isNaN(n) || n<0){ alert('رقم غير صحيح'); return; } pay.sel[k] = Math.min(n, 999); }
  payRefresh(sid, ym);
}
function payAll(ym){
  if(!payOldOk(ym)) return;
  cache.students.filter(x=>x.branchId===pay.bid).forEach(x=>{ pay.sel[x.id+'|'+ym] = PAY_PRICE; payRefresh(x.id, ym); });
}

async function payDelMonth(ym){
  const id = pay.bid, b = getBranch(id), ms = payMonthsOf(b);
  if(ms.length<=1){ alert('لا يمكن حذف آخر شهر'); return; }
  if(!await uiConfirm('حذف شهر '+monthLabel(ym,true)+' وكل دفعاته لطلاب الشعبة؟ لا يمكن التراجع.')) return;
  try{
    for(const st of cache.students.filter(x=>x.branchId===id)){
      const det = cache.details[st.id]; if(!det) continue;
      for(const r of (det.payments||[]).filter(r=>payParse(r).ym===ym)){ await deleteDoc(doc(db,'students',st.id,'payments',r.id)); }
      det.payments = (det.payments||[]).filter(r=>payParse(r).ym!==ym);
    }
    await updateDoc(doc(db,'branches',id), {payMonths: ms.filter(m=>m!==ym)});
    await loadBranches(); pay.bid = ''; goto('branchPayments', {id});
  }catch(e){ alert('تعذّر حذف الشهر: '+e.message); }
}

async function savePayGrid(){
  const alertEl = document.getElementById('p-alert'), changes = [], keys = new Set([...Object.keys(pay.sel), ...Object.keys(pay.prev)]);
  keys.forEach(k=>{ if(pay.sel[k]!==pay.prev[k]){ const [sid,ym] = k.split('|'); changes.push({sid, ym, k, v:pay.sel[k]}); } });
  if(!changes.length){ alertEl.innerHTML = `<div class="alert error">${icon('alert',16)} ما في تغييرات جديدة للحفظ</div>`; return; }
  let failed = 0;
  await Promise.all(changes.map(async c=>{
    try{
      const col = 'payments', old = pay.src[c.k];
      if(c.v===undefined){ await deleteDoc(doc(db,'students',c.sid,col,old||c.ym)); delete pay.src[c.k]; delete pay.prev[c.k]; }
      else {
        await setDoc(doc(db,'students',c.sid,col,c.ym), {ym:c.ym, month:monthLabel(c.ym,true), amount:c.v, status: c.v>=PAY_PRICE?'مدفوع':(c.v>0?'جزئي':'غير مدفوع'), recordedBy:state.personName, recordedAt:serverTimestamp()});
        if(old && old!==c.ym) await deleteDoc(doc(db,'students',c.sid,col,old));
        pay.src[c.k] = c.ym; pay.prev[c.k] = c.v;
      }
      const det = cache.details[c.sid];
      if(det){ det.payments = (det.payments||[]).filter(r=>payParse(r).ym!==c.ym); if(c.v!==undefined) det.payments.push({id:c.ym, ym:c.ym, month:monthLabel(c.ym,true), amount:c.v, status: c.v>=PAY_PRICE?'مدفوع':(c.v>0?'جزئي':'غير مدفوع')}); }
    }catch(e){ failed++; }
  }));
  const info = document.getElementById('p-info'); if(info){ const n = payDirty(); info.textContent = n ? 'تغييرات غير محفوظة: '+n : ''; }
  alertEl.innerHTML = failed
    ? `<div class="alert error">${icon('alert',16)} تعذّر حفظ ${failed} من ${changes.length}، جرّب مرة ثانية</div>`
    : `<div class="alert success">${icon('check',16)} تم حفظ ${changes.length} تغيير</div>`;
}

/* ===== التقييم الأسبوعي للشعبة ===== */
function wkWindows(b){
  const isOff = d => new Date(d+'T00:00:00').getDay()===dayOn(b,'attendance',d);
  const back = d => { let p = addDaysStr(d,-1); for(let i=0;i<8 && !isOff(p);i++) p = addDaysStr(p,-1); return p; };
  let d = todayStr(); for(let i=0;i<8 && !isOff(d);i++) d = addDaysStr(d,-1);
  const out = []; let end = todayStr();
  for(let k=0;k<12;k++){ out.push({start:d, end}); end = addDaysStr(d,-1); d = back(d); }
  return out;
}
function wkEval(studs, w){
  const inW = dt => !!dt && dt>=w.start && dt<=w.end, logs = [];
  studs.forEach(s=>{ const det = cache.details[s.id]||{};
    [['hifzLog','حفظ'],['reviewLog','مراجعة'],['recitationLog','سرد']].forEach(([k,t])=>(det[k]||[]).forEach(r=>{ if(inW(r.date)) logs.push({s,r,t}); })); });
  const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+gradeToPct(y.r.grade),0)/a.length) : null;
  let ok = 0, all = 0;
  studs.forEach(s=>((cache.details[s.id]||{}).attendance||[]).forEach(r=>{ if(inW(r.date)){ all++; if(r.status!=='غياب') ok++; } }));
  return {pct:avg(logs), hifz:avg(logs.filter(x=>x.t==='حفظ')), review:avg(logs.filter(x=>x.t==='مراجعة')), recite:avg(logs.filter(x=>x.t==='سرد')),
    count:logs.length, reciters:new Set(logs.map(x=>x.s.id)).size, total:studs.length, att: all ? Math.round(ok/all*100) : null,
    per: studs.map(s=>{ const rs = logs.filter(x=>x.s.id===s.id); return {s, n:rs.length, pct:avg(rs)}; }).sort((a,b)=>(b.pct??-1)-(a.pct??-1))};
}
const wkColor = p => p>=90 ? '#3FAE6F' : p>=75 ? '#E0B84B' : '#F08A4B';

async function saveWirdEdit(sid, coll, id, from){
  const showErr = m=>{ document.getElementById('wf-alert').innerHTML = `<div class="alert error">${icon('alert',16)} ${m}</div>`; };

/* ===== تقرير النقاط ===== */
function periodPred(period, from, to){
  if(period==='all') return ()=>true;
  if(period==='custom') return d => !!d && (!from || d>=from) && (!to || d<=to);
  return d => inPeriod(d, period);
}
function pointsBreakdown(s, pred){
  const det = cache.details[s.id]||{}, items = []; let att = 0, h = 0, r = 0, c = 0, adj = 0;
  (det.attendance||[]).forEach(x=>{ if(pred(x.date)){ const v = ATT_POINTS[x.status]||0; att += v; items.push({date:x.date, type:'حضور', desc:x.status, pts:v}); } });

  const b = cache.branches.find(z=>z.id===x.branchId); if(!b) return null;
  const d = cache.details[x.id]||{}, recs = (kind==='attendance' ? d.attendance : d.tajweedAtt) || [], today = todayStr();
  const join = [x.createdAt ? ymdLocal(new Date(tsMillis(x.createdAt))) : null, ...recs.map(r=>r.date)].filter(Boolean).sort()[0];
  const set = new Set(recs.filter(r=>r.date && r.date<=today && pred(r.date)).map(r=>r.date)), days = new Set();
  for(let dt = new Date('2026-05-01T00:00:00'); ; dt.setDate(dt.getDate()+1)){
    const ds = ymdLocal(dt); if(ds>today) break;
    if(!pred(ds) || (join && ds<join)) continue;
    if(dt.getDay()===dayOn(b, kind, ds)){ set.add(ds); days.add(dt.getDay()); }
  }

function rpWmMake(color){
  if(RP_WM[color]) return RP_WM[color];
  return RP_WM[color] = new Promise(res=>{ const im = new Image(); im.onload = ()=>{ try{
      const cv = document.createElement('canvas'); cv.width = im.naturalWidth*2; cv.height = im.naturalHeight*2; const g = cv.getContext('2d');
      g.drawImage(im,0,0,cv.width,cv.height); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0,0,cv.width,cv.height); res(cv.toDataURL('image/png'));
    }catch(e){ res(''); } }; im.onerror = ()=>res(''); im.src = LOGO_EMBLEM; });
}
async function rpWmFill(root){ for(const im of root.querySelectorAll('img.rp-wm:not([src])')){ const u = await rpWmMake(im.dataset.c||'#0F7B3E'); if(u) im.src = u; else im.remove(); } }
function rpCfg(){ let c={}; try{ c=JSON.parse(localStorage.getItem('rpCfg')||'{}')||{}; }catch(e){}
  const d=rpDef(), m={...d,...c,cols:{...d.cols,...(c.cols||{})}};
  m.secs=(Array.isArray(m.secs)?m.secs:[]).filter(x=>RP_SEC[x[0]]); Object.keys(RP_SEC).forEach(k=>{ if(!m.secs.some(x=>x[0]===k)) m.secs.push([k,1]); });
  if(!/^#[0-9a-f]{6}$/i.test(m.color)) m.color=d.color; return m; }
function rpSave(c){ try{ localStorage.setItem('rpCfg',JSON.stringify(c)); }catch(e){ alert('تعذّر حفظ إعدادات التقرير'); } }
function rpPage(x, pred, perTxt){

  const wl = [['hifzLog','حفظ'],['reviewLog','مراجعة'],['recitationLog','سرد']].flatMap(([k,t])=>inP(d[k]).map(r=>({...r,t}))).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const cols = [['date','التاريخ',r=>r.date],['t','النوع',r=>r.t],['from','من',r=>r.from],['to','إلى',r=>r.to],['pages','الصفحات',r=>pgTxt(r.pagesEst||0)],['errors','أخطاء',r=>r.errors],['grade','التقدير',r=>r.grade]].filter(k=>c.cols[k[0]]);
  const P = {
    att: (()=>{ const T = o['مواعيد الفترة'], TT = o['مواعيد التجويد بالفترة'], fr = (v,t)=> t!=='' && t!=null ? v+' من '+t : v;
      const miss = T ? T-(o['أيام الحضور']+o['أيام التأخر']+o['أيام الغياب']) : 0;
      return `<div class="rp-h">الحضور</div><div class="rp-sess">مواعيد الفترة: <b>${rpEsc(T||0)}</b> ${T?`موعدًا (${o['أيام الدوام']?'أيام '+rpEsc(o['أيام الدوام']):'حسب يوم الدوام'})`:''}</div><div class="rp-grid">${kv('حضور',fr(o['أيام الحضور'],T))}${kv('تأخر',fr(o['أيام التأخر'],T))}${kv('غياب',fr(o['أيام الغياب'],T))}${miss>0?kv('لم يُسجَّل',fr(miss,T)):''}${kv('حضور التجويد',fr(o['أيام حضور التجويد'],TT))}</div>`; })()+`${c.chips?`<div class="rp-chips">${chips(inP(d.attendance))}</div>`:''}`,

    pts: `<div class="rp-h">النقاط</div><div class="rp-grid">${kv('الحضور',o['نقاط الحضور'])}${kv('الحفظ',o['نقاط الحفظ'])}${kv('المراجعة',o['نقاط المراجعة'])}${kv('السرد',o['نقاط السرد'])}${kv('تعديلات',o['تعديلات يدوية'])}${kv('المجموع',o['المجموع'])}</div>`,
    notes: x.notes ? `<div class="rp-h">ملاحظات</div><div class="rp-notes">${rpEsc(x.notes)}</div>` : ''
  };
  const rpc = c.bauto!==false ? brInk(x.branchId) : c.color;
  return `<section class="rp-sheet" style="--rpc:${rpc}"><div class="rp-share-row"><button class="rp-share" data-sid="${x.id}" title="إرسال تقرير ${rpEsc(x.name)} عبر واتساب" onclick="window.rpShare(this)"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2.2A9.7 9.7 0 0 0 3.7 16.9L2.3 21.8l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.7a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11 11 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.3z"/></svg><span>إرسال</span></button></div><div class="rp-top">${c.logo?`<img class="rp-logo" src="${c.logo}" alt="">`:''}<div style="flex:1"><div class="rp-brand">${rpEsc(c.header)}</div><div class="rp-sub">${rpEsc(c.title)}</div></div><div class="rp-date">${rpEsc(perTxt)}<br>أُعدّ بتاريخ ${todayStr()}</div></div>

  ${c.secs.filter(q=>q[1]).map(q=>P[q[0]]||'').join('')}

    note:'مسار هادئ يناسب الصغار والمبتدئين: حفظ قليل ثابت مع مراجعة مستمرة.'},
  p3:{name:'خطة الثلاث سنوات', short:'3 سنوات', years:3, terms:6, termJuz:5, yearJuz:10, monthTxt:'جزء كامل (حزبان)', monthPages:20, weekTxt:'ربعان (نصف حزب)', weekPages:5, dayPages:1, studyMonths:5, reciteMonth:true,
    note:'المسار المتوسط: ستة فصول، كل فصل خمسة أجزاء تُحفظ ثم تُسمَّع كاملة.'},
  p2:{name:'خطة السنتين', short:'سنتان', years:2, terms:4, termJuz:7.5, yearJuz:15, monthTxt:'جزء ونصف (3 أحزاب)', monthPages:30, weekTxt:'ثلاثة أرباع', weekPages:7.5, dayPages:1.5, studyMonths:5, reciteMonth:true,
    note:'المسار المكثّف للطلاب المتمكّنين وأصحاب الحفظ السابق.'}
};
const PLAN_DAYS = 5;
const fmtNum = n => (Math.round(n*100)/100).toString();
function pagesTxt(p){
  p = Math.round(p*100)/100;
  const w = Math.floor(p), f = p - w, fr = f>=0.74 ? 'وثلاثة أرباع' : f>=0.49 ? 'ونصف' : f>=0.24 ? 'وربع' : '';
  if(!w) return f>=0.74 ? 'ثلاثة أرباع صفحة' : f>=0.49 ? 'نصف صفحة' : f>=0.24 ? 'ربع صفحة' : '0 صفحة';
  const base = w===1 ? 'صفحة' : w===2 ? 'صفحتان' : w+' '+(w<=10?'صفحات':'صفحة');
  return fr ? base+' '+fr : base;
}
// الأجزاء بالترتيب من جزء عمّ نزولًا (الترتيب الأشيع للحلقات)
function trackTerms(t){
  const per = t.terms/t.years;
  return Array.from({length:t.terms},(_,i)=>({n:i+1, from:30-i*t.termJuz, to:30-(i+1)*t.termJuz+1, year:Math.floor(i/per)+1}));
}
function juzRangeTxt(a, b){ const A = a%1 ? 'منتصف '+(a+0.5) : a, B = b%1 ? 'منتصف '+(b-0.5) : b; return A===B ? 'الجزء '+A : A+' ← '+B; }
const YEAR_TXT = ['','الأولى','الثانية','الثالثة','الرابعة','الخامسة'];
const TERM_TXT = n => ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][n-1]||n;

/* ---------- خطة الطالب ---------- */
function studentTrack(s){ const p = s && s.plan; return p && TRACKS[p.id] ? {...TRACKS[p.id], id:p.id, start:p.start||todayStr(), daily:(p.daily!=null && p.daily!=='' ? Number(p.daily) : TRACKS[p.id].dayPages), days:Number(p.days)||PLAN_DAYS, custom:p.daily!=null && p.daily!==''} : null; }
function canEditPlan(s){ return state.role==='admin' || (canEditBranch(s.branchId) && canDo('editPlan')); }
function planProgress(s){
  const t = studentTrack(s); if(!t) return null;
  const det = cache.details[s.id]||{}, today = todayStr();
  const days = Math.max(0, Math.round((new Date(today)-new Date(t.start))/864e5));
  const perWeek = t.daily*t.days, yearly = perWeek*52*(t.studyMonths/(t.studyMonths+(t.reciteMonth?1:0)));
  const expected = Math.round(days/365*yearly*10)/10;
  const actual = Math.round((det.hifzLog||[]).filter(r=>r.date && r.date>=t.start).reduce((a,r)=>a+(Number(recPages(r))||0),0)*10)/10;
  const diff = Math.round((actual-expected)*10)/10;
  const total = 604, pct = Math.min(100, Math.round(actual/total*1000)/10);
  return {t, days, expected, actual, diff, perWeek, pct, status: diff>=-0.5 ? (diff>perWeek ? 'ahead' : 'on') : (diff>=-perWeek ? 'slight' : 'behind')};
}
const PLAN_ST = {ahead:['متقدّم على الخطة','green'], on:['على المسار','green'], slight:['متأخر قليلًا','gold'], behind:['متأخر عن الخطة','red']};
function planCardHTML(s, from){
  const pp = planProgress(s), can = canEditPlan(s);
  if(!pp) return can ? `<div class="pl-card pl-empty"><div><b>${icon('list',16)} لا توجد خطة حفظ لهذا الطالب</b><small>عيّن خطة (5 سنوات، 3 سنوات، سنتان) لتظهر الخطة اليومية ومتابعة التقدّم.</small></div><button class="btn btn-primary" onclick="window.goto('studentPlanForm',{id:'${s.id}',from:'${from}'})">تعيين خطة</button></div>` : '';
  const t = pp.t, st = PLAN_ST[pp.status], q = wfQuickPlan(s,'hifzLog');
  const bar = Math.max(4, Math.min(100, pp.expected ? Math.round(pp.actual/Math.max(pp.expected,0.1)*100) : 100));
  return `<div class="pl-card">
    <div class="pl-h"><div><b>${t.name}</b><small>بدأت ${t.start} · ${t.days} أيام أسبوعيًا</small></div><span class="badge ${st[1]==='red'?'':st[1]}" ${st[1]==='red'?'style="background:#FADBD8;color:#B23A3A"':''}>${st[0]}</span></div>
    <div class="pl-today"><span>${icon('book',16)} ورد اليوم</span><b>${pagesTxt(t.daily)}${t.custom?' <em>(مخصّص)</em>':''}</b></div>
    ${q ? `<div class="pl-next">التالي: ${q.name} من الآية ${q.f} إلى ${q.t}</div>` : ''}
    <div class="pl-prog"><div class="pl-prog-l"><span>المنجز منذ البداية: <b>${fmtNum(pp.actual)}</b> ص</span><span>المطلوب حتى اليوم: <b>${fmtNum(pp.expected)}</b> ص</span></div><div class="pl-bar"><i style="width:${bar}%"></i></div>
    <div class="pl-prog-s">${pp.diff>=0 ? 'متقدّم بـ '+fmtNum(pp.diff)+' ص' : 'متأخر بـ '+fmtNum(-pp.diff)+' ص'} · أسبوعيًا ${pagesTxt(pp.perWeek)} · محفوظ من المصحف ${pp.pct}%</div></div>
    <div class="pl-btns">${canHifzFor(s)?`<button class="btn btn-primary" onclick="window.goto('wirdForm',{id:'${s.id}',from:'${from}'})">${icon('plus',15)} تسجيل ورد اليوم</button>`:''}${can?`<button class="btn btn-outline" onclick="window.goto('studentPlanForm',{id:'${s.id}',from:'${from}'})">${icon('pencil',14)} تعديل الخطة</button>`:''}</div>
  </div>`;
}
function canHifzFor(s){ return canEditBranch(s.branchId) && canDo('hifz'); }

  const s = findStudent(state.params.id), from = state.params.from || 'adminDirectory';

  <div class="field"><label>المسار</label><div class="pl-pick">${Object.entries(TRACKS).map(([k,t])=>`<label class="pl-opt"><input type="radio" name="pf-track" value="${k}" ${k===cur?'checked':''} onchange="window.pfTrack(this.value)"><div><b>${t.name}</b><small>${t.yearJuz} أجزاء سنويًا · أسبوعيًا ${t.weekTxt} (${pagesTxt(t.weekPages)})</small></div></label>`).join('')}</div></div>

    <div class="row-sub" style="margin-top:4px">المقدار الافتراضي للمسار: <b id="pf-def">${pagesTxt(TRACKS[cur].dayPages)}</b> · <span style="color:var(--green); cursor:pointer; font-weight:700" onclick="window.pfReset()">إرجاع الافتراضي</span></div></div>
  <button class="btn btn-primary" style="margin-top:16px" onclick="window.pfSave('${s.id}','${from}')">حفظ الخطة</button>
  ${s.plan ? `<button class="btn btn-outline" style="margin-top:10px; color:#B23A3A" onclick="window.pfRemove('${s.id}','${from}')">إلغاء الخطة عن الطالب</button>` : ''}
  <div id="pf-alert"></div>`;

function pfTrack(k){ const d = document.getElementById('pf-def'), i = document.getElementById('pf-daily'); if(d) d.textContent = pagesTxt(TRACKS[k].dayPages); if(i) i.value = TRACKS[k].dayPages; pfLbl(); }
function pfStep(v){ const i = document.getElementById('pf-daily'); i.value = Math.max(0.25, Math.min(20, (Number(i.value)||0)+v)); pfLbl(); }
function pfReset(){ const k = (document.querySelector('input[name=pf-track]:checked')||{}).value||'p5'; pfTrack(k); }
function pfLbl(){ const i = document.getElementById('pf-daily'), l = document.getElementById('pf-lbl'); if(i && l){ const d = (document.querySelector('#pf-days .active')||{textContent:'5'}).textContent; l.textContent = 'يوميًا '+pagesTxt(Number(i.value)||0)+' · أسبوعيًا '+pagesTxt((Number(i.value)||0)*parseInt(d)); } }
async function pfSave(sid, from){
  const s = findStudent(sid); if(!s || !canEditPlan(s)) return;
  const id = (document.querySelector('input[name=pf-track]:checked')||{}).value, start = document.getElementById('pf-start').value || todayStr();
  const days = parseInt((document.querySelector('#pf-days .active')||{textContent:'5'}).textContent)||PLAN_DAYS, dv = Number(document.getElementById('pf-daily').value);
  if(!TRACKS[id]) return;
  if(!(dv>0)) { document.getElementById('pf-alert').innerHTML = `<div class="alert error">أدخل مقدارًا يوميًا صحيحًا</div>`; return; }
  const plan = {id, start, days, daily: Math.abs(dv-TRACKS[id].dayPages)<0.001 ? null : dv, by: state.personName||'', at: todayStr()};
  try{ await updateDoc(doc(db,'students',sid), {plan}); s.plan = plan; goto('studentProfile',{id:sid, tab:'data', from}); }
  catch(e){ document.getElementById('pf-alert').innerHTML = `<div class="alert error">تعذّر الحفظ: ${e.message}</div>`; }
}
async function pfRemove(sid, from){
  if(!await uiConfirm('إلغاء خطة الحفظ عن هذا الطالب؟ (سجلات الحفظ لا تتأثر)')) return;
  try{ await updateDoc(doc(db,'students',sid), {plan:null}); const s = findStudent(sid); if(s) s.plan = null; goto('studentProfile',{id:sid, tab:'data', from}); }
  catch(e){ alert('تعذّر الحذف: '+e.message); }
}

/* ---------- نظرة اليوم ---------- */
function lastSessionDate(b, kind){ const today = todayStr(); for(let i=0;i<14;i++){ const d = addDaysStr(today,-i), dt = new Date(d+'T00:00:00'); if(dt.getDay()===dayOn(b,kind,d)) return d; } return null; }
function nextSessionDate(b, kind){ const today = todayStr(); for(let i=0;i<8;i++){ const d = addDaysStr(today,i), dt = new Date(d+'T00:00:00'); if(dt.getDay()===dayOn(b,kind,d)) return d; } return null; }
async function todayView(){
  const brs = cache.branches.filter(b=>canEditBranch(b.id));
  const bid = state.params.bid || (brs.length===1 ? brs[0].id : 'all');
  await loadAllDetails();
  const scope = bid==='all' ? brs : brs.filter(b=>b.id===bid), ids = scope.map(b=>b.id);
  const studs = cache.students.filter(s=>ids.includes(s.branchId)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const ws = weekStartStr(), today = todayStr(), from = 'todayView';
  const anyW = s => { const d = cache.details[s.id]||{}; return [...(d.hifzLog||[]),...(d.reviewLog||[]),...(d.recitationLog||[])].filter(r=>r.date); };
  const notYet = studs.filter(s=>!anyW(s).some(r=>r.date>=ws && r.date<=today));
  const absent = [], unrec = [];
  scope.forEach(b=>{ const ld = lastSessionDate(b,'attendance'); if(!ld) return; cache.students.filter(s=>s.branchId===b.id).forEach(s=>{ const r = ((cache.details[s.id]||{}).attendance||[]).find(x=>x.date===ld); if(!r) unrec.push({s,d:ld}); else if(r.status==='غياب') absent.push({s,d:ld}); }); });
  const behind = studs.map(s=>({s, pp:planProgress(s)})).filter(x=>x.pp && (x.pp.status==='behind'||x.pp.status==='slight')).sort((a,b)=>a.pp.diff-b.pp.diff);
  const watch = acWatch(studs);
  const fmtD = d => d ? AR_DAYS[new Date(d+'T00:00:00').getDay()]+' '+(+d.slice(8))+'/'+(+d.slice(5,7)) : '';
  const lastW = s => { const L = anyW(s).map(r=>r.date).sort(); return L.length ? 'آخر ورد '+fmtD(L.pop()) : 'لا يوجد ورد مسجّل'; };
  const row = (s, sub, btn) => `<div class="row"><div class="row-left" style="cursor:pointer" onclick="window.goto('studentProfile',{id:'${s.id}',tab:'hifz',from:'${from}'})"><div class="avatar" style="${s.photo?'':''}">${s.photo?`<img src="${s.photo}" alt="">`:initials(s.name)}</div><div><div class="row-title">${s.name}</div><div class="row-sub">${sub}</div></div></div>${btn||''}</div>`;
  const recBtn = s => canHifzFor(s) ? `<button class="td-btn" onclick="window.goto('wirdForm',{id:'${s.id}',from:'${from}'})">${icon('plus',14)} ورد</button>` : '';
  const sec = (key, title, color, n, body, open) => `<details class="td-sec" ${open?'open':''}><summary><span class="td-dot" style="background:${color}"></span><b>${title}</b><span class="td-n" style="background:${color}">${n}</span><span class="chevron">${icon('chevronL',14)}</span></summary><div class="list" style="margin-top:8px">${body || `<div class="empty" style="padding:16px">${icon('check',20)}<div style="margin-top:4px">لا أحد — ممتاز</div></div>`}</div></details>`;
  const multi = scope.length>1;
  const sessions = scope.map(b=>{ const isToday = new Date().getDay()===dayOn(b,'attendance',today), cnt = cache.students.filter(s=>s.branchId===b.id), done = cnt.filter(s=>((cache.details[s.id]||{}).attendance||[]).some(r=>r.date===today)).length, nx = nextSessionDate(b,'attendance');
    return `<div class="td-ses" style="--bc:${colorOfBranch(b.id)}"><div><b>شعبة ${b.name}</b><small>${isToday ? `اليوم يوم دوام · الحضور مسجّل لـ ${done} من ${cnt.length}` : 'الموعد القادم: '+fmtD(nx)}</small></div>${isToday && canEditBranch(b.id) && canDo('attendance') ? `<button class="td-btn solid" onclick="window.goto('branchAttendance',{id:'${b.id}',fresh:1})">${done<cnt.length?'سجّل الحضور':'مراجعة'}</button>` : ''}</div>`; }).join('');
  return subheader('نظرة اليوم', homeRoute()) + `
  <div class="td-date">${AR_DAYS[new Date().getDay()]} ${today}${hijri(today)?' · '+hijri(today).day+' '+hijri(today).name:''}</div>
  ${brs.length>1 ? `<div class="ac-br" style="margin-top:10px"><button class="${bid==='all'?'on':''}" style="--bc:#6C6C70" onclick="window.goto('todayView',{bid:'all'})">كل الشعب</button>${brs.map(b=>`<button class="${b.id===bid?'on':''}" style="--bc:${colorOfBranch(b.id)}" onclick="window.goto('todayView',{bid:'${b.id}'})">شعبة ${b.name}</button>`).join('')}</div>` : ''}
  <div class="td-stats">
    <div><b>${studs.length-notYet.length}<small>/${studs.length}</small></b><span>سمّعوا هذا الأسبوع</span></div>
    <div class="${absent.length?'warn':''}"><b>${absent.length}</b><span>غابوا آخر موعد</span></div>
    <div class="${behind.length?'warn':''}"><b>${behind.length}</b><span>متأخرون عن الخطة</span></div>
    <div class="${watch.length?'warn':''}"><b>${watch.length}</b><span>يحتاجون متابعة</span></div>

  const bak=cache.students;

}

/* ===== لوحة الطالب: بطاقات + خريطة الحفظ + منحنى النمو ===== */
const JUZ_START = [1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const juzRange = j => [JUZ_START[j-1], j===30 ? 604 : JUZ_START[j]-1];
const juzOfPage = p => { let j = 1; for(let i=0;i<30;i++){ if(p>=JUZ_START[i]) j = i+1; } return j; };
let profIns = null, hmMode = 'mem', hmEdit = false;
function recPageSpan(r){
  const m1 = /^(.*)\s(\d+)$/.exec(r.from||''), m2 = /^(.*)\s(\d+)$/.exec(r.to||'');
  if(!m1 || !m2 || m1[1]!==m2[1]) return null;
  const idx = SURAHS.findIndex(x=>x.name===m1[1]); if(idx<0) return null;
  try{
    const a = findMushafPage(idx+1, Math.min(+m1[2],+m2[2])), b = findMushafPage(idx+1, Math.max(+m1[2],+m2[2]));
    if(!a || !b) return null;
    return [Math.min(a,b), Math.max(a,b)];
  }catch(e){ return null; }
}
function weeksTxt(n){ return n===1 ? 'أسبوع' : n===2 ? 'أسبوعين' : n+' أسابيع'; }
function studentInsights(s, det){
  const A = det.attendance||[], H = det.hifzLog||[], R = det.reviewLog||[], C = det.recitationLog||[], P = det.pointsAdjustments||[];
  const today = todayStr();
  const mates = cache.students.filter(x=>x.branchId===s.branchId).sort((a,b)=>(b.points||0)-(a.points||0));
  const ri = mates.findIndex(x=>x.id===s.id);
  const att = A.filter(r=>r.status==='حضور' || r.status==='تأخر').length;
  let got = 0, max = 0, n = 0;
  [[H,TYPE_POINTS.hifz],[R,TYPE_POINTS.review],[C,TYPE_POINTS.recitation]].forEach(([log,t])=>log.forEach(r=>{ n++; got += recPts(t,r); max += r.pts!=null ? t[0]*Math.max(1,Number(r.pagesEst)||1) : t[0]; }));
  const sumPages = (log, pred) => log.reduce((a,r)=>a+((!pred || pred(r.date)) ? recPages(r) : 0), 0);
  const inMonth = d => inPeriod(d,'month');
  const all = [...H.map(r=>({r,t:'حفظ'})), ...R.map(r=>({r,t:'مراجعة'})), ...C.map(r=>({r,t:'سرد'}))].filter(x=>x.r.date).sort((a,b)=>b.r.date.localeCompare(a.r.date));
  // خريطة الحفظ
  const mem = new Set(), lastRev = {}, recSet = new Set(), prevSet = new Set();
  const mark = (sp, date) => { for(let p=sp[0]; p<=sp[1]; p++){ mem.add(p); recSet.add(p); if(!lastRev[p] || date>lastRev[p]) lastRev[p] = date; } };
  [...H,...R,...C].forEach(r=>{ const sp = recPageSpan(r); if(sp) mark(sp, r.date||''); });
  prevEntries(s).forEach(e=>{ const sp = prevSpan(e); if(sp) for(let p=sp[0]; p<=sp[1]; p++){ mem.add(p); prevSet.add(p); } });
  const cutoff = addDaysStr(today,-30);
  const juz = Array.from({length:30},(_,i)=>{ const [a,b] = juzRange(i+1); let g = 0, f = 0;
    for(let p=a;p<=b;p++){ if(mem.has(p)){ g++; if(lastRev[p] && lastRev[p]>=cutoff) f++; } }
    return {total:b-a+1, got:g, fresh:f}; });
  const lastH = H.filter(r=>r.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  let curJuz = null; if(lastH){ const sp = recPageSpan(lastH); if(sp) curJuz = juzOfPage(sp[1]); }
  if(!curJuz){ let bi = -1, bv = 0; juz.forEach((x,i)=>{ const v = x.got/x.total; if(v<1 && v>bv){ bv = v; bi = i; } }); if(bi>=0) curJuz = bi+1; }
  const perWeek = H.filter(r=>r.date && r.date>=addDaysStr(today,-56)).reduce((a,r)=>a+recPages(r),0)/8;
  let fc = 'سجّل أوراد حفظ ليظهر توقّع الختمة';
  if(curJuz){ const rem = juz[curJuz-1].total-juz[curJuz-1].got;
    if(rem<=0) fc = 'اكتمل جزء '+curJuz+' 🎉';
    else if(perWeek>0) fc = 'بهذا المعدل ختمة جزء '+curJuz+' بعد '+weeksTxt(Math.ceil(rem/perWeek))+' تقريبًا';
    else fc = 'جزء '+curJuz+' قيد الحفظ — لا يوجد حفظ جديد خلال آخر 8 أسابيع'; }
  // منحنى النمو
  const ev = [];
  A.forEach(r=>ev.push([r.date, ATT_POINTS[r.status]||0]));
  H.forEach(r=>ev.push([r.date, recPts(TYPE_POINTS.hifz,r)])); R.forEach(r=>ev.push([r.date, recPts(TYPE_POINTS.review,r)])); C.forEach(r=>ev.push([r.date, recPts(TYPE_POINTS.recitation,r)]));
  P.forEach(a=>ev.push([a.date, a.delta||0]));
  const evs = ev.filter(e=>e[0]);
  const wk = d => addDaysStr(d, -((new Date(d+'T00:00:00').getDay()+1)%7));
  const byW = {}; evs.forEach(([d,v])=>{ const k = wk(d); byW[k] = (byW[k]||0)+v; });
  const base = (s.points||0) - evs.reduce((a,e)=>a+e[1],0);
  let pts = [];
  if(evs.length){
    const keys = Object.keys(byW).sort(), endW = [wk(today), keys[keys.length-1]].sort().pop();
    let cum = base;
    for(let w = keys[0]; w<=endW; w = addDaysStr(w,7)){ const d = byW[w]||0; cum += d; pts.push({w, cum, d}); }
    if(pts.length>26) pts = pts.slice(-26); else if(base!==0) pts.unshift({w:null, cum:base, d:base});
  }
  if(pts.length<2){ const c = pts[0] ? pts[0].cum : (s.points||0); pts = [{w:null, cum:pts[0] ? pts[0].cum-pts[0].d : 0, d:0}, pts[0] || {w:today, cum:c, d:0}]; }
  return {
    sid:s.id, canEdit: canEditBranch(s.branchId) && canDo('editStudent'), prevSel:new Set(s.prevJuz||[]), prevList: prevEntries(s), partial: s.prevPartial||{},
    points:s.points||0, rankTxt: mates.length>1 && ri>=0 ? 'المرتبة '+(ri+1)+' من '+mates.length+' بشعبته' : 'مجموع نقاطك الإجمالي',
    attPct: A.length ? Math.round(att/A.length*100) : 0, attTxt: A.length ? 'سجل '+att+' من '+A.length+' مواعيد' : 'لا يوجد سجل حضور بعد',
    exPct: max ? Math.min(100, Math.round(got/max*100)) : 0, exTxt: 'سجل '+n+' ورد (حفظ ومراجعة وسرد)',
    pagesTotal: Math.round(sumPages(H)+sumPages(R)), pagesMonth: Math.round(sumPages(H,inMonth)+sumPages(R,inMonth)),
    last: all[0]||null, juz, mem, lastRev, cutoff, prevPages: prevSet, wirdPages: recSet, memCount: mem.size, fc, sel: curJuz||1, growth: pts
  };
}

function pmSubmit(){

  const id = d.idx>=0 ? I.prevList[d.idx].id : pmId();
  if(d.kind==='juz'){ e = {id, kind:'juz', juz:Number(document.getElementById('pm-juz').value)}; }
  else {
    const sObj = SURAHS.find(x=>x.name===document.getElementById('pm-surah-input').value.trim());
    if(!sObj){ alert('اختر اسم السورة من القائمة'); return; }
    const f = parseInt(normDigits(document.getElementById('pm-from').value),10), t = parseInt(normDigits(document.getElementById('pm-to').value),10);
    if(!f || !t || f<1 || t<1 || f>sObj.ayat || t>sObj.ayat){ alert('سورة '+sObj.name+' آياتها من 1 إلى '+sObj.ayat); return; }
    if(f>t){ alert('آية البداية لازم تكون أصغر من أو تساوي آية النهاية'); return; }
    e = {id, kind:'range', surah:sObj.name, from:f, to:t};
  }
  const list = [...I.prevList]; if(d.idx>=0) list[d.idx] = e; else list.push(e);
  pmSave(list);
}

function pgAdd(list, p){
  const out = list.map(e=>({...e}));
  const adj = out.find(e=>e.kind==='pages' && e.to===p-1), nx = out.find(e=>e.kind==='pages' && e.from===p+1);
  if(adj){ adj.to = p; if(nx && nx!==adj){ adj.to = nx.to; out.splice(out.indexOf(nx),1); } return out; }
  if(nx){ nx.from = p; return out; }
  out.push({id:pmId(), kind:'pages', from:p, to:p}); return out;
}
function pgRemove(list, p){
  const out = [];
  list.forEach(e=>{
    const sp = prevSpan(e);
    if(!sp || p<sp[0] || p>sp[1]){ out.push(e); return; }
    if(sp[0]<=p-1) out.push({id:pmId(), kind:'pages', from:sp[0], to:p-1});
    if(p+1<=sp[1]) out.push({id:pmId(), kind:'pages', from:p+1, to:sp[1]});
  });
  return out;
}

function growthSVG(g){
  const W = 320, H = 120, pl = 14, pr = 14, pt = 12, pb = 10, n = g.length;
  const mx = Math.max(...g.map(x=>x.cum)), mn = Math.min(0, ...g.map(x=>x.cum)), rg = (mx-mn)||1;
  const X = i => W-pr-i*(W-pl-pr)/(n-1), Y = v => H-pb-(v-mn)/rg*(H-pt-pb);
  let d = 'M'+X(0)+','+Y(g[0].cum);
  for(let i=1;i<n;i++){ const c = (X(i-1)+X(i))/2; d += ' C'+c+','+Y(g[i-1].cum)+' '+c+','+Y(g[i].cum)+' '+X(i)+','+Y(g[i].cum); }
  const area = d+' L'+X(n-1)+','+(H-pb)+' L'+X(0)+','+(H-pb)+' Z';
  const dots = g.map((x,i)=>`<circle class="gc-dot" cx="${X(i)}" cy="${Y(x.cum)}" r="3.5"></circle><circle cx="${X(i)}" cy="${Y(x.cum)}" r="11" fill="transparent" style="cursor:pointer" onclick="window.growthTip(${i})"></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; margin-top:10px; overflow:visible"><defs><linearGradient id="gcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8A317" stop-opacity=".35"/><stop offset="1" stop-color="#E8A317" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#e6ece8"/><path class="gc-area" d="${area}" fill="url(#gcg)"/><path class="gc-line" pathLength="1" d="${d}"/>${dots}</svg>`;
}
function growthTip(i){

}
function dashAfter(){
  const root = document.querySelector('.sd-dash'); if(!root) return;
  const reduce = presReduce();
  root.querySelectorAll('[data-cnt]').forEach(el=>{
    const to = Number(el.dataset.cnt)||0, suf = el.dataset.suf||'', t0 = performance.now(), dur = 1200;
    const fmt = v => Math.round(v).toLocaleString('en')+suf;
    if(reduce){ el.textContent = fmt(to); return; }
    const tick = now=>{ if(!el.isConnected) return; const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = fmt(to*e); if(k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function juzRing(memPages){
  const frac = Math.min(1, memPages/604), C = 2*Math.PI*40, jz = (memPages/604*30).toFixed(1).replace(/\.0$/,'');
  return `<svg viewBox="0 0 100 100" width="96" height="96" style="flex-shrink:0"><circle cx="50" cy="50" r="40" fill="none" stroke="#EEF0F2" stroke-width="10"/><circle class="jr" cx="50" cy="50" r="40" fill="none" stroke="#E0B84B" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="--c:${C}" transform="rotate(-90 50 50)"/><text x="50" y="47" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="900" fill="#0f7a44">${jz}</text><text x="50" y="66" text-anchor="middle" font-size="8.5" fill="#7a8794">من 30 جزء</text></svg>`;
}

function wfQuickPlan(s, coll){
  const det = cache.details[s.id]; const arr = det && det[coll]; if(!arr || !arr.length) return null;
  const last = [...arr].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || tsMillis(b.recordedAt)-tsMillis(a.recordedAt))[0];
  const parse = x => { const m = String(x||'').trim().match(/^(.*\S)\s+(\d+)$/); return m ? {name:m[1], n:parseInt(m[2],10)} : null; };
  const a = parse(last.from), b = parse(last.to); if(!a || !b || a.name!==b.name) return null;
  let idx = SURAHS.findIndex(x=>x.name===b.name); if(idx<0) return null;
  const full = last.fullPages!=null ? Number(last.fullPages) : null, frac = Number(last.frac)||0;
  if(full===null || isNaN(full) || (full===0 && frac===0)) return null;
  const len = Math.max(1, b.n - a.n + 1);
  let f = b.n + 1;
  if(f > SURAHS[idx].ayat){
    const sorted = [...arr].sort((x,y)=> (y.date||'').localeCompare(x.date||'') || tsMillis(y.recordedAt)-tsMillis(x.recordedAt)), pv = sorted[1] && parse(sorted[1].to), pi = pv ? SURAHS.findIndex(x=>x.name===pv.name) : -1;
    const back = pi>=0 && pi!==idx ? pi>idx : idx>=77;   // جزء عمّ يُحفظ غالبًا من الناس صعودًا
    idx += back ? -1 : 1; f = 1;
  }
  if(idx < 0 || idx >= SURAHS.length) return null;
  let t = Math.min(SURAHS[idx].ayat, f + len - 1), nf = full, nfr = frac;
  const tr = coll==='hifzLog' ? studentTrack(s) : null, Q = qIndex();
  if(Q){
    const ay = SURAHS[idx].ayat, p0 = Q.pageOf[idx][f];
    if(tr){
      if(tr.daily>=1){ const endP = p0 + Math.ceil(tr.daily) - 1; t = f; while(t+1<=ay && Q.pageOf[idx][t+1]<=endP) t++; }
      else { const onP = []; for(let a=1;a<=ay;a++) if(Q.pageOf[idx][a]===p0) onP.push(a); const rem = onP.filter(a=>a>=f), k = Math.max(1, Math.round(onP.length*tr.daily)); t = rem[Math.min(rem.length-1, k-1)] || f; }
    }
    try{ const sg = rangeSuggest(SURAHS[idx].name, f, t); if(sg){ nf = sg.full; nfr = sg.frac; } }catch(e){}
  }
  return {name:SURAHS[idx].name, f, t, full:nf, frac:nfr, lastDate:last.date, lastTxt: last.from+' – '+last.to, plan: tr};
}

async function saveWird(sid, from){

  const ptsTable = {'حفظ':TYPE_POINTS.hifz,'مراجعة':TYPE_POINTS.review,'سرد':TYPE_POINTS.recitation}[typeTxt];

    if(f>t){ showErr(tag+'آية البداية لازم تكون أصغر من أو تساوي آية النهاية'); return; }

    if(sg && Math.abs((full+frac)-sg.total)>0.5) warns.push(tag+sObj.name+': أدخلت '+pgTxt(full+frac)+' صفحة، والمتوقع من الآيات حوالي '+pgTxt(sg.total));
    items.push({surah:sObj.name, f, t, errors, grade:gradeFromErrors(errors), full, frac, pagesEst:+(full+frac).toFixed(2), pagesExact:true, pts: full>0 ? wirdPts(ptsTable, errors, full) : 0});
  }

  try{

    document.getElementById('wf-alert').innerHTML = `<div class="alert success">${icon('check',16)} تم تسجيل ${items.length>1 ? items.length+' سور' : typeTxt} باسم ${recordedBy} (+${total} نقطة، ${pgTxt(pages)} صفحة${approx?' تقريبًا':''})</div>`;

function inPeriod(date, period){

function studentStats(s, period){
  const det = cache.details[s.id];
  let pts;
  if(period==='all'){ pts = s.points||0; }
  else {
    pts = 0;
    det.attendance.forEach(r=>{ if(inPeriod(r.date,period)) pts += ATT_POINTS[r.status]||0; });
    det.hifzLog.forEach(r=>{ if(inPeriod(r.date,period)) pts += recPts(TYPE_POINTS.hifz, r); });
    det.reviewLog.forEach(r=>{ if(inPeriod(r.date,period)) pts += recPts(TYPE_POINTS.review, r); });
    (det.recitationLog||[]).forEach(r=>{ if(inPeriod(r.date,period)) pts += recPts(TYPE_POINTS.recitation, r); });
    (det.pointsAdjustments||[]).forEach(a=>{ if(inPeriod(a.date,period)) pts += a.delta||0; });
  }
  let ph=0, pr=0;
  det.hifzLog.forEach(r=>{ if(inPeriod(r.date,period)) ph += recPages(r); });
  det.reviewLog.forEach(r=>{ if(inPeriod(r.date,period)) pr += recPages(r); });
  const cyc = studentCycle(det.hifzLog);
  const wEval = cyc.evals.length? cyc.evals[cyc.evals.length-1].pct : null;
  const mEval = monthlyFromEvals(cyc.evals);
  return {s, pts, ph, pr, pages:ph+pr, wEval, mEval};
}

/* ================= الإنجازات (صفحة لكل شعبة + مقارنة عادلة) ================= */
const AC_PER = {week:'هذا الأسبوع', month:'هذا الشهر', all:'كل الفترات'};
const AC_PREV = {week:'عن الأسبوع الماضي', month:'عن الشهر الماضي'};
function acLogs(s, pred){
  const d = cache.details[s.id]||{}, out = [];
  [['hifzLog','حفظ'],['reviewLog','مراجعة'],['recitationLog','سرد']].forEach(([k,t])=>(d[k]||[]).forEach(r=>{ if(pred(r.date)) out.push({r,t}); }));
  return out;
}
function acStats(studs, pred, isAll){
  let pts=0, pages=0, ok=0, att=0, reciters=0, g=0, gn=0;
  studs.forEach(s=>{
    const c = presCalc(s, pred); pts += isAll ? (s.points||0) : c.pts; pages += c.pages;
    ok += c.c['حضور']+c.c['تأخر']; att += c.c['حضور']+c.c['تأخر']+c.c['غياب'];
    const L = acLogs(s, pred); if(L.length) reciters++; L.forEach(x=>{ g += gradeToPct(x.r.grade); gn++; });
  });
  const n = studs.length || 1;
  return {n:studs.length, pts, pages:Math.round(pages*10)/10, ptsAvg:Math.round(pts/n*10)/10, pagesAvg:Math.round(pages/n*10)/10,
    attPct: att ? Math.round(ok/att*100) : null, grade: gn ? Math.round(g/gn) : null, reciters};
}
// متى اكتمل كل جزء عند الطالب (من الأوراد المسجّلة بتواريخها)
function acJuzEvents(s){
  const det = cache.details[s.id]||{}, base = new Set();
  prevEntries(s).forEach(e=>{ const sp = prevSpan(e); if(sp) for(let p=sp[0]; p<=sp[1]; p++) base.add(p); });
  const recs = [...(det.hifzLog||[]), ...(det.reviewLog||[]), ...(det.recitationLog||[])].filter(r=>r.date).map(r=>({d:r.date, sp:recPageSpan(r)})).filter(x=>x.sp).sort((a,b)=>a.d.localeCompare(b.d));
  const mem = new Set(base), done = new Set(), ev = [];
  const full = j => { const [a,b] = juzRange(j); for(let p=a;p<=b;p++) if(!mem.has(p)) return false; return true; };
  for(let j=1;j<=30;j++) if(full(j)) done.add(j);
  for(let i=0;i<recs.length;i++){
    for(let p=recs[i].sp[0]; p<=recs[i].sp[1]; p++) mem.add(p);
    if(recs[i+1] && recs[i+1].d===recs[i].d) continue;
    for(let j=1;j<=30;j++) if(!done.has(j) && full(j)){ done.add(j); ev.push({date:recs[i].d, kind:'juz', juz:j, count:done.size}); }
  }
  return ev;
}
function acFeed(studs, period, pred, prevPred){
  const items = [];
  studs.forEach(s=>{
    acJuzEvents(s).forEach(e=>{ if(!pred(e.date)) return;
      items.push({date:e.date, s, ic:'book', cls:'gold', t:`أتمّ حفظ الجزء ${e.juz}`});
      if(e.count===30) items.push({date:e.date, s, ic:'crown', cls:'gold', t:'ختم القرآن الكريم كاملًا 🎉'});
      else if(e.count%5===0) items.push({date:e.date, s, ic:'star', cls:'green', t:`وصل إلى ${e.count} أجزاء محفوظة`}); });
    const zero = acLogs(s, pred).filter(x=>String(x.r.errors)==='0');
    if(period!=='all' && zero.length>=3) items.push({date:zero.map(x=>x.r.date).sort().pop(), s, ic:'check', cls:'green', t:`سمّع ${zero.length} أوراد دون أي خطأ`});
    if(period==='month'){ const A = ((cache.details[s.id]||{}).attendance||[]).filter(r=>pred(r.date));
      if(A.length>=3 && A.every(r=>r.status==='حضور')) items.push({date:A.map(r=>r.date).sort().pop(), s, ic:'checksq', cls:'green', t:'حضور كامل طوال الشهر'}); }
  });
  if(prevPred){
    studs.map(s=>({s, d:presCalc(s,pred).pts - presCalc(s,prevPred).pts})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,3)
      .forEach((x,k)=>items.push({date:'', s:x.s, ic:'trend', cls:'blue', t:`${k===0?'الأكثر تحسّنًا':'من الأكثر تحسّنًا'}: +${x.d} نقطة ${AC_PREV[period]}`}));
  }

function acWatch(studs){
  const today = todayStr(), d14 = addDaysStr(today,-14), d30 = addDaysStr(today,-30), out = [];
  studs.forEach(s=>{
    const det = cache.details[s.id]||{}, why = [];
    const all = [...(det.hifzLog||[]), ...(det.reviewLog||[]), ...(det.recitationLog||[])].filter(r=>r.date);
    const last = all.map(r=>r.date).sort().pop();
    if(!last) why.push('لا يوجد أي ورد مسجّل'); else if(last<d14) why.push('لم يسمّع منذ '+Math.round((new Date(today)-new Date(last))/864e5)+' يومًا');
    const A = (det.attendance||[]).filter(r=>r.date>=d30);
    if(A.length>=2){ const p = Math.round(A.filter(r=>r.status!=='غياب').length/A.length*100); if(p<60) why.push('الحضور '+p+'% آخر 30 يومًا'); }
    const lastRev = {};
    all.forEach(r=>{ const sp = recPageSpan(r); if(sp) for(let p=sp[0]; p<=sp[1]; p++) if(!lastRev[p] || r.date>lastRev[p]) lastRev[p] = r.date; });
    const pg = Object.keys(lastRev); if(pg.length>=5){ const old = pg.filter(p=>lastRev[p]<d30).length; if(old/pg.length>0.5) why.push('أكثر من نصف محفوظه لم يُراجع منذ شهر'); }
    if(why.length) out.push({s, why});
  });
  return out.sort((a,b)=>b.why.length-a.why.length);
}

  if(prev==null || cur==null) return '';

  return `<span class="ac-d ${up?'up':'down'}">${up?'▲':'▼'} ${txt}</span>`;
}

  const assigned = (sup.branchIds||[]).filter(id=>cache.branches.some(b=>b.id===id)).length;
  const branchesGroup = capGroupHTML(
    {key:'branches', title:'الشعب المُسندة', sub:'التعديل مقصور على الشعب المُسندة فقط', icon:'building'},
    assigned, cache.branches.length,
    cache.branches.map(b=>{ const checked=(sup.branchIds||[]).includes(b.id);
      return `<div class="row" onclick="window.toggleSupBranch('${sup.id}','${b.id}')"><div class="row-title">شعبة ${b.name}</div><span class="badge ${checked?'green':'gray'}">${checked?'مُسندة':'غير مُسندة'}</span></div>`;
    }).join('') + `<div class="row" style="font-size:12px; color:var(--text-muted)">يشوف هذا المشرف كل الشعب دائمًا، بس التعديل مقصور على الشعب المُسندة فقط</div>`
  );
  const groups = CAP_GROUPS.map(g=>{
    const on = g.caps.filter(isOn).length;
    const rows = g.caps.map(k=>`<div class="row" onclick="window.toggleSupCapability('${sup.id}','${k}')"><div class="row-title">${ALL[k]}</div><span class="badge ${isOn(k)?'green':'gray'}">${isOn(k)?'مفعّلة':'موقوفة'}</span></div>`).join('');
    const note = g.sensitive ? `<div class="cap-note">صلاحيات حساسة ومقفولة افتراضيًا: "تعديل محتوى الموقع" بتعطي المشرف زر القلم لتعديل النصوص، و"عرض تعريف المشرفين" بتفتحله بيانات باقي المشرفين.</div>` : '';
    return capGroupHTML(g, on, g.caps.length, rows + note);
  }).join('');
  return subheader('حساب المشرف','accountAdmin') + supCard(sup,'supervisorPermissions') + `
  <div class="section-title"><span class="bar"></span>الصلاحيات</div>
  <div class="list">${branchesGroup}${groups}</div>
  <div class="alert" style="background:#FBF3DE;color:#8A6D1A;margin-top:12px">${icon('list',15)} فتح وإغلاق أي صلاحية وقت ما بدك — تتحدّث فورًا</div>

}

async function toggleSupCapability(supEmail, capKey){
  const sup = cache.supervisors.find(s=>s.id===supEmail);
  const caps = sup.capabilities || {};
  const current = caps[capKey] !== undefined ? caps[capKey] : CAP_DEFAULT_ON[capKey];
  const newCaps = {...caps, [capKey]: !current};
  try{
    await updateDoc(doc(db,'people',supEmail), {capabilities: newCaps});
    await loadSupervisors();
  }catch(e){ alert('تعذّر تحديث الصلاحية: '+e.message); }
  goto('supervisorPermissions',{id:supEmail});
}
async function toggleSupBranch(supEmail, bid){
  const sup = cache.supervisors.find(s=>s.id===supEmail);

    await updateDoc(doc(db,'people',supEmail), { branchIds: has? arrayRemove(bid) : arrayUnion(bid) });

async function toggleSupTajweed(email, key){
