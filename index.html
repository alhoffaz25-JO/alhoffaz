<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>شعبة الحفاظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --green:#098046; --green-dark:#06532E; --green-tint:#EBF5F0;
  --gold:#D6A755; --gold-light:#E4C690; --beige:#F3EEE0; --bg:#FFFFFF; --card:#FFFFFF;
  --text:#1C241C; --text-muted:#748078; --border:#DCEAE1; --radius:16px;
  --shadow:0 1px 2px rgba(6,83,46,0.05), 0 10px 26px -10px rgba(6,83,46,0.16);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:80px; min-height:100vh;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
svg{display:block;}
.topbar{background:linear-gradient(155deg,var(--green) 0%,var(--green-dark) 100%); color:#fff; padding:20px 18px 24px; position:sticky; top:0; z-index:25; overflow:hidden;}
.topbar::before{content:""; position:absolute; inset:0; background-image:radial-gradient(circle at 92% -10%, rgba(228,198,144,0.22) 0, transparent 45%), repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 22px);}
.topbar-row{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
.brand{display:flex; align-items:center; gap:11px;}
.logo-circle{width:42px; height:42px; border-radius:50%; background:var(--gold-light); color:var(--green-dark); display:flex; align-items:center; justify-content:center; border:1.5px solid rgba(255,255,255,0.55); box-shadow:0 2px 8px rgba(0,0,0,0.15); overflow:hidden;}
.logo-circle img{width:100%; height:100%; object-fit:cover;}
.brand-name{font-family:'Amiri',serif; font-weight:700; font-size:19px;}
.brand-sub{font-size:10.5px; color:rgba(255,255,255,0.68); margin-top:1px;}
.topbar-actions{display:flex; gap:9px; align-items:center;}
.icon-btn{width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,0.1);}
.icon-btn.on{background:var(--gold-light); color:var(--green-dark);}
.greeting{position:relative; z-index:1; margin-top:16px; font-size:13.5px; color:rgba(255,255,255,0.82);}
.greeting b{font-weight:700; color:#fff;}
.greeting-rule{width:30px; height:2px; background:var(--gold-light); border-radius:2px; margin-top:9px; position:relative; z-index:1;}
.edit-banner{background:var(--gold); color:#fff; text-align:center; font-size:11.5px; font-weight:700; padding:7px;}
.page{padding:18px 16px 24px; max-width:520px; margin:0 auto; animation:fade .2s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
.section-title{font-size:13.5px; font-weight:700; color:var(--text); margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.section-title .bar{width:4px; height:14px; background:linear-gradient(180deg,var(--gold-light),var(--gold)); border-radius:2px;}
.vision-card{background:linear-gradient(160deg,var(--green-dark),var(--green)); color:#fff; border-radius:20px; padding:22px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.vision-card::before{content:""; position:absolute; inset:0; background-image:repeating-linear-gradient(45deg, rgba(228,198,144,0.05) 0 2px, transparent 2px 24px);}
.vision-title{font-family:'Amiri',serif; font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; position:relative; z-index:1;}
.vision-title .vi{width:28px; height:28px; border-radius:8px; background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; color:var(--gold-light);}
.vision-text{font-size:12.5px; line-height:1.9; color:rgba(255,255,255,0.88); margin-top:8px; position:relative; z-index:1;}
.vision-divider{height:1px; background:rgba(255,255,255,0.15); margin:14px 0;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
.stat-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow);}
.stat-icon{width:32px; height:32px; border-radius:9px; background:var(--green-tint); color:var(--green); display:flex; align-items:center; justify-content:center;}
.stat-num{font-size:22px; font-weight:900; color:var(--green); margin-top:9px;}
.stat-label{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.khana-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
.khana{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 12px; text-align:center; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:9px; position:relative;}
.khana:active{transform:scale(.96);}
.khana-icon{width:46px; height:46px; border-radius:13px; background:var(--green-tint); color:var(--green); display:flex; align-items:center; justify-content:center;}
.khana-label{font-size:13.5px; font-weight:700;}
.khana-sub{font-size:10.5px; color:var(--text-muted);}
.list{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-top:8px;}
.row{display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-bottom:1px solid var(--border); gap:10px;}
.row:last-child{border-bottom:none;}
.row-left{display:flex; align-items:center; gap:11px; min-width:0;}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--green-tint); color:var(--green); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px; flex-shrink:0; overflow:hidden; position:relative;}
.avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
.avatar-edit-badge{position:absolute; bottom:-2px; left:-2px; width:22px; height:22px; border-radius:50%; background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center; border:2px solid var(--card);}
.row-title{font-size:13.5px; font-weight:700;}
.row-sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.chevron{color:var(--text-muted); display:flex;}
.badge{font-size:10.5px; padding:4px 10px; border-radius:20px; font-weight:700;}
.badge.green{background:var(--green-tint); color:var(--green);}
.badge.gold{background:#F3EBD6; color:var(--gold);}
.badge.gray{background:#EFEFEF; color:#888;}
.badge.red{background:#FBEAEA; color:#B23A3A;}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; text-align:center; padding:13.5px; border-radius:12px; font-weight:700; font-size:14px;}
.btn-primary{background:var(--green); color:#fff; box-shadow:0 8px 18px -6px rgba(15,58,41,0.45);}
.btn-outline{background:transparent; border:1.5px solid var(--green); color:var(--green);}
.fab{position:fixed; bottom:94px; left:16px; width:52px; height:52px; border-radius:50%; background:linear-gradient(155deg,var(--gold-light),var(--gold)); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -4px rgba(173,138,70,0.55); z-index:20;}
.search-box{display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-top:14px; color:var(--text-muted);}
.search-box input{border:none; outline:none; background:transparent; font-family:inherit; font-size:13.5px; width:100%; color:var(--text);}
.field{margin-top:13px;}
.field label{font-size:12px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px; font-family:inherit; font-size:13.5px; background:var(--card); color:var(--text);}
.field textarea{resize:vertical; min-height:70px;}
.seg{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
.seg button{flex:1; min-width:60px; padding:10px; border-radius:10px; border:1.5px solid var(--border); font-size:12.5px; font-weight:700; color:var(--text-muted); background:var(--card);}
.seg button.active{border-color:var(--green); background:var(--green-tint); color:var(--green);}
.progress-wrap{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-top:16px; box-shadow:var(--shadow); text-align:center;}
.ring{width:112px; height:112px; margin:6px auto 0; position:relative;}
.ring svg{transform:rotate(-90deg);}
.ring-num{position:relative; margin-top:-90px; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-num b{font-size:20px; color:var(--green); font-family:'Amiri',serif;}
.bar-bg{height:8px; background:var(--green-tint); border-radius:20px; overflow:hidden; margin-top:8px;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--green)); border-radius:20px;}
table{width:100%; border-collapse:collapse; font-size:11px; background:var(--card); border-radius:12px; overflow:hidden; margin-top:10px; box-shadow:var(--shadow);}
thead tr{background:var(--green-dark); color:#fff;}
th,td{padding:8px 5px; text-align:center;}
tbody tr:nth-child(even){background:var(--green-tint);}
tbody tr{border-bottom:1px solid var(--border);}
.tabs{display:flex; gap:4px; margin-top:16px; border-bottom:1.5px solid var(--border); overflow-x:auto;}
.tab{padding:10px 6px; font-size:12px; font-weight:700; color:var(--text-muted); flex:1; text-align:center; border-bottom:2.5px solid transparent; white-space:nowrap;}
.tab.active{color:var(--green); border-color:var(--gold);}
.subheader{display:flex; align-items:center; gap:11px; padding:15px 16px; background:var(--card); border-bottom:1px solid var(--border);}
.back-btn{width:32px; height:32px; border-radius:50%; background:var(--green-tint); color:var(--green); display:flex; align-items:center; justify-content:center;}
.subheader h1{font-size:15px; font-weight:700;}
.bottomnav{position:fixed; bottom:0; right:0; left:0; background:var(--card); border-top:1px solid var(--border); display:flex; z-index:30; padding:7px 4px calc(7px + env(safe-area-inset-bottom));}
.navitem{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; color:var(--text-muted); font-size:10px; font-weight:700;}
.navitem.active{color:var(--green);}
.alert{border-radius:12px; padding:11px 13px; font-size:12.5px; margin-top:12px; display:flex; gap:9px; align-items:center; font-weight:700;}
.alert.success{background:#E6F5EC; color:#06532E;}
.alert.error{background:#FBEAEA; color:#B23A3A;}
body.login-bg{background:radial-gradient(circle at 50% -10%, #359767 0%, var(--green-dark) 55%, #03311B 100%);}
.login-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px 24px; text-align:center; position:relative; overflow:hidden;}
.logo-ring{width:150px; height:150px; border-radius:50%; margin:0 auto 14px; position:relative; z-index:1; padding:5px; background:rgba(255,255,255,0.07); border:1.5px solid rgba(228,198,144,0.55); box-shadow:0 10px 30px -8px rgba(0,0,0,0.45);}
.logo-ring img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
.logo-wordmark{position:relative; z-index:1; margin:0 auto; display:block;}
.login-card{background:var(--card); width:100%; max-width:380px; border-radius:20px; margin-top:32px; padding:24px 20px; box-shadow:0 20px 44px -12px rgba(0,0,0,0.35); text-align:right; position:relative; z-index:1;}
.mode-switch{display:flex; gap:6px; background:var(--green-tint); border-radius:12px; padding:4px; margin-bottom:16px;}
.mode-switch button{flex:1; padding:9px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--text-muted);}
.mode-switch button.active{background:var(--card); color:var(--green); box-shadow:var(--shadow);}
.hint{font-size:10.5px; color:rgba(255,255,255,0.55); text-align:center; margin-top:20px; max-width:320px; line-height:1.6; position:relative; z-index:1;}
.level-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:15px; margin-top:10px; box-shadow:var(--shadow); position:relative;}
.level-head{display:flex; align-items:center; justify-content:space-between;}
.level-name{font-weight:700; font-size:13.5px;}
.level-text{font-size:12px; color:var(--text-muted); line-height:1.9; margin-top:8px;}
.empty{text-align:center; padding:34px 10px; color:var(--text-muted); font-size:13px;}
.empty .e-icon{display:flex; justify-content:center; margin-bottom:10px; color:var(--text-muted); opacity:.6;}
.spin{width:26px; height:26px; border:3px solid var(--green-tint); border-top-color:var(--green); border-radius:50%; margin:40px auto; animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.editable{position:relative; display:block;}
.edit-mode .editable{outline:1.5px dashed var(--gold); border-radius:8px; padding:4px 6px; cursor:pointer;}
.edit-pencil{display:inline-flex; width:18px; height:18px; border-radius:50%; background:var(--gold); color:#fff; align-items:center; justify-content:center; margin-inline-start:6px; vertical-align:middle;}
.edit-mode .khana{outline:1.5px dashed var(--gold);}
</style>
</head>

function C(key){ const v = cache.content[key]; if(v !== undefined && v !== '') return v; return CONTENT_DEFAULTS[key] !== undefined ? CONTENT_DEFAULTS[key] : ''; }
function gradeToPct(g){ return {'ممتاز':100,'جيد جدًا':85,'جيد':70,'مقبول':55}[g] ?? 70; }
function studentCycle(hifzLog){
  const log = [...hifzLog].sort((a,b)=>a.date.localeCompare(b.date));
  const evals = [];
  for(let i=0; i+4<=log.length; i+=4){
    const group = log.slice(i,i+4);
    const avg = Math.round(group.reduce((sum,e)=>sum+gradeToPct(e.grade),0)/4);
    evals.push({date:group[3].date, pct:avg});
  }
  return { evals, inProgress: log.length % 4 };
}
function monthlyFromEvals(evals){ const m = todayStr().slice(0,7); const inMonth = evals.filter(e=>e.date.startsWith(m)); if(!inMonth.length) return null; return Math.round(inMonth.reduce((a,e)=>a+e.pct,0)/inMonth.length); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function weekStartStr(){ const d=new Date(); const day=d.getDay(); const diff=(day-6+7)%7; d.setDate(d.getDate()-diff); return d.toISOString().slice(0,10); }
const ATT_POINTS = {'حضور':7,'تأخر':3,'غياب':0};
const TYPE_POINTS = { hifz:{0:6,1:4,2:2}, review:{0:3,1:2,2:1}, recitation:{0:5,1:3,2:2} };
function tierPts(table, errStr){ const n=parseInt(errStr); const t = isNaN(n)?2:Math.min(n,2); return table[t]||0; }
function pointsFromRecords(det){
  const ws = weekStartStr(); const ms = todayStr().slice(0,7);
  let weekly=0, monthly=0;
  const items = [
    ...(det.attendance||[]).map(r=>({date:r.date, pts: ATT_POINTS[r.status]||0})),
    ...(det.hifzLog||[]).map(r=>({date:r.date, pts: tierPts(TYPE_POINTS.hifz, r.errors)})),
    ...(det.reviewLog||[]).map(r=>({date:r.date, pts: tierPts(TYPE_POINTS.review, r.errors)})),
    ...(det.recitationLog||[]).map(r=>({date:r.date, pts: tierPts(TYPE_POINTS.recitation, r.errors)})),
  ];
  items.forEach(it=>{ if(it.date>=ws) weekly+=it.pts; if(it.date && it.date.startsWith(ms)) monthly+=it.pts; });
  return {weekly, monthly};
}

function isOnline(person){
  if(!person || !person.lastActive) return false;
  const t = person.lastActive.toMillis ? person.lastActive.toMillis() : (person.lastActive.seconds? person.lastActive.seconds*1000 : 0);
  return (Date.now() - t) < 45000;
}

let activating = false;
async function bootSession(user){
  const email = user.email.toLowerCase();
  const pdoc = await getDoc(doc(db,'people',email));
  if(!pdoc.exists()){
    state = {role:null, personEmail:null, personName:null, personPhoto:null, view:'login', params:{}, loginMode:'signin', editMode:false, capabilities:{}, branchIds:[]};
    renderLoginError('لا يوجد حساب مُعرَّف لهذا البريد داخل النظام. تواصل مع مدير النظام.');
    await signOut(auth);
    return;
  }
  const p = pdoc.data();
  state.role = p.role; state.personEmail = email; state.personName = p.name || email; state.personPhoto = p.photo || null;
  state.branchIds = p.branchIds || []; state.studentId = p.studentId || null; state.capabilities = p.capabilities || {};
  await loadBranches();
  await loadContent();

    cache.students = sdoc.exists() ? [{id:state.studentId, ...sdoc.data()}] : [];
  } else { await loadStudentsForRole(); }

  if(!heartbeatInterval) heartbeatInterval = setInterval(sendHeartbeat, 25000);
  goto(state.role==='admin'?'adminHome': state.role==='supervisor'?'supervisorHome':'studentHome');
}

function resizeImageToDataURL(file, maxSize){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev => { img.src = ev.target.result; };
    img.onload = () => {
      let w=img.width, h=img.height;
      if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } } else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.85));
    };
    img.onerror = reject; reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleAvatarFile(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeImageToDataURL(file, 260);
    await setDoc(doc(db,'people',state.personEmail), {photo: dataUrl}, {merge:true});

}

}

function renderBottomNav(){
  let items=[];
  if(state.role==='admin') items=[['adminHome','home','الرئيسية'],['adminBranches','building','الشعب'],['adminDirectory','idcard','الطلاب'],['adminPoints','star','النقاط'],['accountAdmin','user','حسابي']];

  if(state.role==='student') items=[['studentHome','home','ملفي'],['accountStd','user','حسابي']];
  const activeRoot = {branchDetail:'adminBranches'}[state.view] || state.view;
  return `<div class="bottomnav">${items.map(([v,ic,label])=>`

  switch(state.view){
    case 'adminHome': return await adminHome();
    case 'adminBranches': return adminBranches();
    case 'branchDetail': return branchDetail();
    case 'adminDirectory': return directory();
    case 'addStudentForm': return addStudentForm();
    case 'plansHome': return plansHome();
    case 'planDetail': return planDetail();
    case 'achievementsHome': return await achievementsHome();
    case 'adminPoints': return pointsHome();
    case 'studentProfile': return await studentProfileView('manage');
    case 'editStudentForm': return editStudentForm();
    case 'adjustPointsForm': return adjustPointsForm();
    case 'notificationsView': return await notificationsView();
    case 'wirdForm': return wirdForm();
    case 'accountAdmin': return await accountView();
    case 'inviteForm': return inviteForm();
    case 'supervisorPermissions': return supervisorPermissions();
    case 'supervisorHome': return supervisorHome();
    case 'accountSup': return await accountView();

    case 'editContentForm': return editContentForm();

async function submitAddStudent(){
  const name = document.getElementById('as-name').value.trim();
  if(!name){ alert('اكتب اسم الطالب'); return; }
  const data = {
    name, branchId: document.getElementById('as-branch').value,
    age: Number(document.getElementById('as-age').value)||null,
    phone: document.getElementById('as-phone').value,
    birthDate: document.getElementById('as-bd').value,
    hifzAmount: document.getElementById('as-hifz').value,
    tajweedLevel: document.getElementById('as-tajweed').value,
    notes: document.getElementById('as-notes').value,
    points:0, createdAt: serverTimestamp()
  };
  try{
    await addDoc(collection(db,'students'), data);
    await loadStudentsForRole();
    document.getElementById('as-alert').innerHTML = `<div class="alert success">${icon('check',16)} تمت إضافة الطالب</div>`;
    setTimeout(()=>goto('adminDirectory'), 700);
  }catch(e){ document.getElementById('as-alert').innerHTML = `<div class="alert error">تعذّرت الإضافة: ${e.message}</div>`; }

async function deleteStudentFully(sid, from){
  if(!confirm('حذف هذا الطالب وكل سجلاته (الحفظ، المراجعة، المواعيد، الدفع) نهائيًا؟ لا يمكن التراجع.')) return;
  try{
    const subs = ['hifzLog','reviewLog','recitationLog','attendance','tajweedAtt','payments','pointsAdjustments'];
    for(const sub of subs){
      const snap = await getDocs(collection(db,'students',sid,sub));
      for(const d of snap.docs){ await deleteDoc(d.ref); }
    }
    await deleteDoc(doc(db,'students',sid));
    await loadStudentsForRole();
    goto('adminDirectory');
  }catch(e){ alert('تعذّر حذف الطالب: '+e.message); }
}
async function submitEditStudent(sid, from){
  const data = {
    name: document.getElementById('es-name').value.trim(),
    branchId: document.getElementById('es-branch').value,
    age: Number(document.getElementById('es-age').value)||null,
    phone: document.getElementById('es-phone').value,
    birthDate: document.getElementById('es-bd').value,
    hifzAmount: document.getElementById('es-hifz').value,
    tajweedLevel: document.getElementById('es-tajweed').value,
    notes: document.getElementById('es-notes').value,
  };
  try{
    await updateDoc(doc(db,'students',sid), data);
    await loadStudentsForRole();
    document.getElementById('es-alert').innerHTML = `<div class="alert success">${icon('check',16)} تم حفظ التعديلات</div>`;
    setTimeout(()=>goto('studentProfile',{id:sid, tab:'data', from}), 700);
  }catch(e){ document.getElementById('es-alert').innerHTML = `<div class="alert error">${icon('check',16)} تعذّر الحفظ: ${e.message}</div>`; }
}

  const s = findStudent(state.params.id);
  const from = state.params.from || 'adminDirectory';
  return `<div class="subheader"><div class="back-btn" onclick="window.goto('studentProfile',{id:'${s.id}',tab:'data',from:'${from}'})">${icon('chevronR',16)}</div><h1>تعديل النقاط يدويًا</h1></div>
  <div class="list" style="padding:14px 14px 2px; margin-top:0"><div class="row-title">${s.name}</div><div class="row-sub">النقاط الحالية: ${s.points||0}</div></div>
  <div class="field"><label>المقدار (استخدم رقم سالب للخصم، مثل -5)</label><input type="number" id="pa-delta" placeholder="مثال: 10 أو -5"></div>
  <div class="field"><label>السبب</label><input type="text" id="pa-reason" placeholder="مثال: مكافأة حفظ متقن"></div>
  <button class="btn btn-primary" style="margin-top:16px" onclick="window.submitPointsAdjust('${s.id}','${from}')">حفظ</button>
  <div id="pa-alert"></div>`;
}
async function submitPointsAdjust(sid, from){
  const delta = Number(document.getElementById('pa-delta').value);
  const reason = document.getElementById('pa-reason').value.trim();
  if(!delta){ document.getElementById('pa-alert').innerHTML = `<div class="alert error">اكتب رقمًا غير صفر</div>`; return; }
  if(!reason){ document.getElementById('pa-alert').innerHTML = `<div class="alert error">لازم تكتب سبب التعديل</div>`; return; }
  try{
    await addDoc(collection(db,'students',sid,'pointsAdjustments'), {delta, reason, recordedBy:state.personName, date:todayStr(), recordedAt:serverTimestamp()});
    await updateDoc(doc(db,'students',sid), {points: increment(delta)});
    await loadStudentsForRole();
    await ensureStudentDetail(sid, true);
    document.getElementById('pa-alert').innerHTML = `<div class="alert success">${icon('check',16)} تم تعديل النقاط (${delta>0?'+':''}${delta})</div>`;
    setTimeout(()=>goto('studentProfile',{id:sid, tab:'data', from}), 700);
  }catch(e){ document.getElementById('pa-alert').innerHTML = `<div class="alert error">تعذّر الحفظ: ${e.message}</div>`; }
}

function planDetail(){
  const key = state.params.key;
  const def = PLAN_KEYS[key];
  const title = C('plan_'+key+'_title');
  const count = parseInt(C('plan_'+key+'_levelCount'))||0;
  let html = subheader(title,'plansHome');
  if(!count){
    html += `<div class="empty"><div class="e-icon">${icon(def.icon,30)}</div>لم تتم إضافة محتوى ${title} بعد</div>`;
  } else {
    for(let i=1;i<=count;i++){
      html += `<div class="level-card"><div class="level-head"><div class="level-name">${editable('plan_'+key+'_l'+i+'_name','اسم المستوى '+i)}</div><span class="badge gold">مستوى ${i}</span></div>
        <div class="level-text">${editable('plan_'+key+'_l'+i+'_text','نص المستوى '+i)}</div></div>`;
    }
  }
  if(canEditContentPerm() && state.editMode){
    html += `<button class="btn btn-outline" style="margin-top:16px" onclick="window.addPlanLevel('${key}')">${icon('plus',16)} إضافة مستوى جديد</button>`;
  }
  return html;
}
async function addPlanLevel(key){
  const count = (parseInt(C('plan_'+key+'_levelCount'))||0) + 1;
  try{
    await setDoc(doc(db,'siteContent','plan_'+key+'_levelCount'), {text:String(count)}, {merge:true});
    cache.content['plan_'+key+'_levelCount'] = String(count);
    goto('planDetail',{key});
  }catch(e){ alert('تعذّر إضافة المستوى: '+e.message); }
}

async function deleteBranch(bid){
  const count = cache.students.filter(s=>s.branchId===bid).length;
  if(count>0){ alert('لا يمكن حذف هذه الشعبة لوجود '+count+' طالب مسجّل فيها. انقلهم أو احذفهم أولًا.'); return; }
  if(!confirm('حذف هذه الشعبة نهائيًا؟')) return;
  try{ await deleteDoc(doc(db,'branches',bid)); await loadBranches(); goto('adminBranches'); }
  catch(e){ alert('تعذّر حذف الشعبة: '+e.message); }
}
async function quickAddBranch(){
  const name = prompt('اسم الشعبة الجديدة:');
  if(!name) return;
  try{ await addDoc(collection(db,'branches'), {name}); await loadBranches(); goto('adminBranches'); }
  catch(e){ alert('تعذّر إضافة الشعبة: '+e.message); }

async function studentProfileView(mode){
  const s = findStudent(state.params.id || state.studentId);
  if(!s) return `<div class="empty">تعذّر إيجاد بيانات الطالب</div>`;
  const canEdit = mode==='manage' && canEditBranch(s.branchId);
  const tab = state.params.tab || 'data';
  const from = state.params.from || 'adminDirectory';
  const backTarget = state.role==='admin'? from : (state.role==='student'?'studentHome':'supervisorHome');
  const tabs = [['data','البيانات'],['hifz','الحفظ'],['attendance','المواعيد'],['tajweed','التجويد'],['pay','الدفع']];
  let body = `<div style="display:flex; flex-direction:column; align-items:center; margin-top:6px">
    ${avatarBlock(64, s.photo, s.name, false)}
    <div style="font-weight:700; margin-top:9px">${s.name}</div>
    <div class="row-sub">شعبة ${getBranch(s.branchId).name}</div>

function ringSvg(pct){
  const r=42, c=2*Math.PI*r, off=c-(c*pct/100);
  return `<svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="${r}" stroke="var(--green-tint)" stroke-width="9" fill="none"/><circle cx="56" cy="56" r="${r}" stroke="var(--gold)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="ring-num"><b>${pct}%</b></div>`;
}

function selectSeg(groupId, btn){ document.querySelectorAll('#'+groupId+' button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function gradeFromErrors(errStr){
  const n = parseInt(errStr);
  if(n===0) return 'ممتاز';
  if(n===1) return 'جيد جدًا';
  return 'جيد';
}
async function saveWird(sid, from){
  const date = document.getElementById('wf-date').value || todayStr();
  const surah = document.getElementById('wf-surah').value || '—';
  const f = document.getElementById('wf-from').value || '1';
  const t = document.getElementById('wf-to').value || '1';
  const errors = document.querySelector('#wf-err .active').textContent;
  const typeTxt = document.querySelector('#wf-type .active').textContent;
  const collKey = {'حفظ':'hifzLog','مراجعة':'reviewLog','سرد':'recitationLog'}[typeTxt];
  const ptsTable = {'حفظ':TYPE_POINTS.hifz,'مراجعة':TYPE_POINTS.review,'سرد':TYPE_POINTS.recitation}[typeTxt];
  const grade = gradeFromErrors(errors);
  const recordedBy = state.personName;
  try{
    await addDoc(collection(db,'students',sid,collKey), {date, from:surah+' '+f, to:surah+' '+t, errors, grade, recordedBy, recordedAt:serverTimestamp()});
    const pts = tierPts(ptsTable, errors);
    if(pts) await updateDoc(doc(db,'students',sid), {points: increment(pts)});
    await loadStudentsForRole();
    await ensureStudentDetail(sid, true);
    document.getElementById('wf-alert').innerHTML = `<div class="alert success">${icon('check',16)} تم تسجيل ${typeTxt} باسم ${recordedBy} (+${pts} نقطة)</div>`;
    setTimeout(()=>goto('studentProfile',{id:sid,tab:'hifz',from}), 700);
  }catch(e){ document.getElementById('wf-alert').innerHTML = `<div class="alert error">تعذّر الحفظ: ${e.message}</div>`; }
}
async function savePayment(sid, from){
  const month = document.getElementById('pay-month').value.trim();
  if(!month){ alert('اكتب اسم الشهر'); return; }
  const amount = Number(document.getElementById('pay-amount').value)||0;
  const status = document.querySelector('#pay-status .active').textContent;
  try{
    await setDoc(doc(db,'students',sid,'payments',month), {month, amount, status, recordedBy:state.personName, recordedAt:serverTimestamp()});
    await ensureStudentDetail(sid, true);
    goto('studentProfile',{id:sid, tab:'pay', from});
  }catch(e){ alert('تعذّر حفظ الدفعة: '+e.message); }
}
async function recordAttendance(sid, status, from){
  const date = document.getElementById('att-date').value || todayStr();
  try{
    const ref = doc(db,'students',sid,'attendance',date);
    const prev = await getDoc(ref);
    const oldPts = prev.exists() ? (ATT_POINTS[prev.data().status]||0) : 0;
    const newPts = ATT_POINTS[status]||0;
    await setDoc(ref, {date, status, recordedBy:state.personName, recordedAt:serverTimestamp()});
    if(newPts-oldPts !== 0){ await updateDoc(doc(db,'students',sid), {points: increment(newPts-oldPts)}); }
    await loadStudentsForRole();
    await ensureStudentDetail(sid, true);
    goto('studentProfile',{id:sid, tab:'attendance', from});
  }catch(e){ alert('تعذّر تسجيل الحضور: '+e.message); }
}
async function recordTajweed(sid, status, from){
  const date = document.getElementById('taj-date').value || todayStr();
  try{
    await setDoc(doc(db,'students',sid,'tajweedAtt',date), {date, status, recordedBy:state.personName, recordedAt:serverTimestamp()});
    await ensureStudentDetail(sid, true);
    goto('studentProfile',{id:sid, tab:'tajweed', from});
  }catch(e){ alert('تعذّر تسجيل حضور التجويد: '+e.message); }
}
async function deleteAttRecord(sid, sub, date, from){
  if(!confirm('حذف هذا السجل؟')) return;
  try{
    if(sub==='attendance'){
      const ref = doc(db,'students',sid,sub,date);
      const prev = await getDoc(ref);
      const oldPts = prev.exists() ? (ATT_POINTS[prev.data().status]||0) : 0;
      await deleteDoc(ref);
      if(oldPts) await updateDoc(doc(db,'students',sid), {points: increment(-oldPts)});
      await loadStudentsForRole();
    } else {
      await deleteDoc(doc(db,'students',sid,sub,date));
    }
    await ensureStudentDetail(sid, true);
    goto('studentProfile',{id:sid, tab: sub==='attendance'?'attendance':'tajweed', from});
  }catch(e){ alert('تعذّر حذف السجل: '+e.message); }
}

async function notificationsView(){
  const list = state.role==='supervisor' ? cache.students.filter(s=>canEditBranch(s.branchId)) : cache.students;
  const unpaid = [];
  for(const s of list){
    const det = await ensureStudentDetail(s.id);
    if(!det.payments.length) continue;
    const latest = [...det.payments].sort((a,b)=>{
      const ta = a.recordedAt && a.recordedAt.toMillis ? a.recordedAt.toMillis() : 0;
      const tb = b.recordedAt && b.recordedAt.toMillis ? b.recordedAt.toMillis() : 0;
      return tb-ta;
    })[0];
    if(latest.status!=='مدفوع') unpaid.push({s, month:latest.month});
  }
  const noPayRecord = list.filter(s=>{ const det=cache.details[s.id]; return det && !det.payments.length; });
  return subheader('الإشعارات', state.role==='admin'?'adminHome':state.role==='supervisor'?'supervisorHome':'studentHome') + `
  <div class="section-title" style="margin-top:0"><span class="bar"></span>دفعات غير مسددة (${unpaid.length})</div>
  <div class="list">${unpaid.length? unpaid.map(u=>`<div class="row" onclick="window.goto('studentProfile',{id:'${u.s.id}',tab:'pay',from:'notificationsView'})"><div class="row-title">${u.s.name}</div><span class="badge red">${u.month}</span></div>`).join('') : `<div class="empty">${icon('check',24)}<div style="margin-top:6px">لا يوجد دفعات متأخرة 👍</div></div>`}</div>
  <div class="section-title"><span class="bar"></span>طلاب بدون أي سجل دفع (${noPayRecord.length})</div>
  <div class="list">${noPayRecord.length? noPayRecord.map(s=>`<div class="row" onclick="window.goto('studentProfile',{id:'${s.id}',tab:'pay',from:'notificationsView'})"><div class="row-title">${s.name}</div><span class="badge gray">لا يوجد سجل</span></div>`).join('') : `<div class="empty">لا يوجد</div>`}</div>`;
}

    return `<div class="row" onclick="window.toggleSupCapability('${sup.id}','${k}')"><div class="row-title">${CAP_LABELS[k]}</div><span class="badge ${on?'green':'gray'}">${on?'مفعّلة':'موقوفة'}</span></div>`;
  }).join('')}</div>
  <div class="alert" style="background:#FBF3DE;color:#8A6D1A;margin-top:12px">${icon('list',15)} فتح وإغلاق أي صلاحية وقت ما بدك — تتحدّث فورًا</div>
  <div class="section-title"><span class="bar"></span>صلاحية إضافية (حساسة)</div>
  <div class="list">${(()=>{ const on = caps.editContent===true;
    return `<div class="row" onclick="window.toggleSupCapability('${sup.id}','editContent')"><div class="row-title">تعديل محتوى الموقع (الرؤية، الخطط، الخانات)</div><span class="badge ${on?'green':'gray'}">${on?'مفعّلة':'موقوفة'}</span></div>`;
  })()}</div>
  <div class="alert" style="background:#FBEAEA;color:#B23A3A;margin-top:8px">${icon('list',15)} هاي صلاحية قوية — بتعطي المشرف نفس زر ✏️ الموجود عند المدير لتعديل نصوص الموقع بالكامل. فعّلها بس لمن تثق فيه تمامًا</div>
  <button class="btn btn-outline" style="margin-top:16px; border-color:#B23A3A; color:#B23A3A" onclick="window.deleteSupervisor('${sup.id}')">${icon('trash',15)} حذف حساب المشرف</button>`;
}
async function deleteSupervisor(email){
  if(!confirm('حذف حساب هذا المشرف؟ لن يقدر يسجّل الدخول بعدها.')) return;
  try{ await deleteDoc(doc(db,'people',email)); await loadSupervisors(); goto('accountAdmin'); }
  catch(e){ alert('تعذّر حذف الحساب: '+e.message); }
}
async function toggleSupCapability(supEmail, capKey){
  const sup = cache.supervisors.find(s=>s.id===supEmail);
  const caps = sup.capabilities || {};
  const current = caps[capKey] !== undefined ? caps[capKey] : CAP_DEFAULT_ON[capKey];
  const newCaps = {...caps, [capKey]: !current};
  try{
    await updateDoc(doc(db,'people',supEmail), {capabilities: newCaps});
    await loadSupervisors();
  }catch(e){ alert('تعذّر تحديث الصلاحية: '+e.message); }
  goto('supervisorPermissions',{id:supEmail});
}
async function toggleSupBranch(supEmail, bid){
  const sup = cache.supervisors.find(s=>s.id===supEmail);
  const has = (sup.branchIds||[]).includes(bid);
  try{
    await updateDoc(doc(db,'people',supEmail), { branchIds: has? arrayRemove(bid) : arrayUnion(bid) });
    await loadSupervisors();
  }catch(e){ alert('تعذّر تحديث الإسناد: '+e.message); }
  goto('supervisorPermissions',{id:supEmail});
}

function inviteForm(){
  const studentsOptions = cache.students.map(s=>`<option value="${s.id}">${s.name} — ${getBranch(s.branchId).name}</option>`).join('');
  return subheader('إضافة حساب جديد','accountAdmin') + `
  <div class="field"><label>البريد الإلكتروني</label><input id="inv-email" type="email"></div>
  <div class="field"><label>الاسم</label><input id="inv-name" type="text"></div>
  <div class="field"><label>الدور</label>
    <div class="seg" id="inv-role">
      <button class="active" onclick="window.selectSeg('inv-role',this); window.toggleInviteExtra('admin')">مدير</button>
      <button onclick="window.selectSeg('inv-role',this); window.toggleInviteExtra('supervisor')">مشرف</button>
      <button onclick="window.selectSeg('inv-role',this); window.toggleInviteExtra('student')">طالب</button>
    </div>
  </div>
  <div id="inv-student-wrap" style="display:none" class="field"><label>ربط بملف طالب موجود</label><select id="inv-student">${studentsOptions}</select></div>
  <button class="btn btn-primary" style="margin-top:18px" onclick="window.submitInvite()">إضافة الحساب</button>
  <div id="inv-alert"></div>`;
}
function toggleInviteExtra(role){ const w=document.getElementById('inv-student-wrap'); if(w) w.style.display = role==='student'?'block':'none'; }
async function submitInvite(){
  const email = document.getElementById('inv-email').value.trim().toLowerCase();
  const name = document.getElementById('inv-name').value.trim();
  const roleTxt = document.querySelector('#inv-role .active').textContent;
  const role = {'مدير':'admin','مشرف':'supervisor','طالب':'student'}[roleTxt];
  if(!email || !name){ alert('عبّي كل الحقول'); return; }
  const data = { email, name, role, branchIds:[], studentId:null, uid:null, createdAt: serverTimestamp() };
  if(role==='student'){ data.studentId = document.getElementById('inv-student').value; }
  if(role==='supervisor'){ data.capabilities = {hifz:true, attendance:true, tajweed:true, editStudent:true, addStudent:true}; }
  try{
    await setDoc(doc(db,'people',email), data);
    if(role==='supervisor') await loadSupervisors();
    document.getElementById('inv-alert').innerHTML = `<div class="alert success">${icon('check',16)} تمت إضافة الحساب، بإمكان صاحبه تفعيله الآن من صفحة الدخول</div>`;
    setTimeout(()=>goto('accountAdmin'), 900);
  }catch(e){ document.getElementById('inv-alert').innerHTML = `<div class="alert error">حدث خطأ: ${e.message}</div>`; }
}

async function accountView(){
  let roleTxt;
  if(state.role==='admin') roleTxt='مدير النظام';
  else if(state.role==='supervisor') roleTxt='مشرف'+((state.branchIds||[]).length? ' - شعبة '+state.branchIds.map(id=>getBranch(id).name).join('، ') : ' (بدون شعبة مُسندة)');
  else roleTxt='طالب - شعبة '+getBranch(findStudent(state.studentId)?.branchId).name;
  let html = subheader('حسابي', state.role==='admin'?'adminHome':state.role==='supervisor'?'supervisorHome':'studentHome') + `
  <div style="display:flex; flex-direction:column; align-items:center; margin-top:12px">
    ${avatarBlock(70, state.personPhoto, state.personName, true)}
    <input type="file" id="avatar-file-input" accept="image/*" style="display:none" onchange="window.handleAvatarFile(event)">
    <div style="font-weight:700; margin-top:11px; font-size:16px">${state.personName}</div>
    <div class="row-sub">${roleTxt}</div>
  </div>
  <div class="list" style="margin-top:20px">
    <div class="row"><span class="row-sub">الدور</span><span class="row-title">${roleTxt}</span></div>
    <div class="row"><span class="row-sub">البريد الإلكتروني</span><span class="row-title">${state.personEmail}</span></div>
  </div>`;
  if(state.role==='admin'){
    await loadSupervisors();
    html += `<div class="section-title"><span class="bar"></span>حسابات المشرفين والصلاحيات</div>
    <div class="list">${cache.supervisors.map(sv=>{ const on = isOnline(sv);
      return `<div class="row" onclick="window.goto('supervisorPermissions',{id:'${sv.id}'})"><div class="row-left"><div class="avatar">${icon('briefcase',16)}</div><div><div class="row-title">${sv.name} <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${on?'#2ECC71':'#D64545'};margin-inline-start:5px;vertical-align:middle;"></span></div><div class="row-sub">${(sv.branchIds||[]).length? sv.branchIds.map(id=>getBranch(id).name).join('، '):'بدون شعبة مُسندة'} · ${on?'متصل الآن':'غير متصل'}</div></div></div><div class="chevron">${icon('chevronL',14)}</div></div>`;
    }).join('')||`<div class="empty">لا يوجد مشرفون بعد</div>`}</div>
    <button class="btn btn-outline" style="margin-top:14px" onclick="window.goto('inviteForm')">${icon('plus',16)} إضافة حساب جديد</button>`;
  }
  html += `<button class="btn btn-outline" style="margin-top:22px" onclick="window.logout()">تسجيل الخروج</button>`;
  return html;
}
